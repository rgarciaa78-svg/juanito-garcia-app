<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Juanito">
<meta name="theme-color" content="#ffffff">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Juanito Garcia</title>
<style>
:root {
  --bg:     #ffffff;
  --bg2:    #ffffff;
  --bg3:    #e8e8ed;
  --card:   #ffffff;
  --card2:  #f5f5f7;
  --border: rgba(0,0,0,0.09);
  --shadow: 0 1px 4px rgba(0,0,0,0.08), 0 0 1px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.06);
  --text:   #1c1c1e;
  --text2:  rgba(0,0,0,0.5);
  --text3:  rgba(0,0,0,0.3);
  --red:    #d32f2f;
  --red-light: #ef5350;
  --red-bg: #ffebee;
  --red-border: rgba(211,47,47,0.25);
  --yellow: #e65100;
  --yellow-light: #f57c00;
  --yellow-bg: #fff3e0;
  --yellow-border: rgba(230,81,0,0.25);
  --green:  #2e7d32;
  --green-light: #388e3c;
  --green-bg: #e8f5e9;
  --green-border: rgba(46,125,50,0.25);
  --accent: #1565c0;
  --accent-bg: #e3f2fd;
  --nav-h: 64px;
  --top-h: 56px;
  --radius: 14px;
  --radius-sm: 10px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; -webkit-font-smoothing: antialiased; }

/* LAYOUT */
#app { display: flex; flex-direction: column; height: 100%; }
#top-bar { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; gap: 12px; min-height: var(--top-h); flex-shrink: 0; }
#top-bar .back-btn { background: none; border: none; color: var(--accent); font-size: 26px; cursor: pointer; padding: 4px 2px; display: none; align-items: center; line-height: 1; }
#top-bar .back-btn.visible { display: flex; }
#top-title { font-size: 17px; font-weight: 700; flex: 1; letter-spacing: -0.3px; color: var(--text); }
#top-sub { font-size: 11px; color: var(--text3); }
#top-badge { font-size: 10px; font-weight: 600; background: var(--bg3); color: var(--text2); padding: 4px 10px; border-radius: 20px; white-space: nowrap; }

#main { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
#nav-bar { background: #1e3a5f; border-top: none; display: flex; min-height: var(--nav-h); flex-shrink: 0; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; padding: 8px 4px; transition: opacity 0.15s; }
.nav-item svg { width: 22px; height: 22px; stroke: rgba(255,255,255,0.5); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.15s; }
.nav-item span { font-size: 10px; font-weight: 500; color: rgba(255,255,255,0.5); transition: color 0.15s; }
.nav-item.active svg { stroke: #ffffff; }
.nav-item.active span { color: #ffffff; }

/* iPad */
@media (min-width: 768px) {
  #app { flex-direction: row; }
  #nav-bar { flex-direction: column; width: 80px; min-height: unset; border-top: none; border-right: 1px solid var(--border); }
  .nav-item { padding: 18px 8px; }
  #top-bar { display: none; }
  #ipad-sidebar-header { display: flex; flex-direction: column; align-items: center; padding: 24px 8px 16px; border-bottom: 1px solid var(--border); }
  #ipad-sidebar-header .logo-text { font-size: 11px; font-weight: 800; color: var(--accent); letter-spacing: 1px; writing-mode: vertical-rl; transform: rotate(180deg); margin-bottom: 8px; }
  #left-panel { display: flex; flex-direction: column; }
  #right-panel { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #main { display: flex; flex: 1; overflow: hidden; }
  .mobile-header { display: none !important; }
}
@media (max-width: 767px) {
  #ipad-sidebar-header { display: none; }
  #left-panel, #right-panel { display: none !important; }
  #right-panel.mobile-active { display: block !important; }
}

/* SCREENS */
.screen { display: none; padding: 16px 14px 24px; }
.screen.active { display: block; }
@media (min-width: 768px) {
  .screen { padding: 24px 24px 32px; }
  #screen-home { grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  #screen-home.active { display: grid; }
  .home-col-right { display: flex; flex-direction: column; gap: 16px; }
}

/* ============================
   SEMÁFOROS
   ============================ */
.semaforos { display: flex; gap: 10px; margin-bottom: 12px; }
.sem-card {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 12px 14px;
  text-align: left;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform 0.12s, box-shadow 0.12s;
  position: relative;
  overflow: hidden;
}
.sem-card-top { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
.sem-card-top .sem-name { flex: 1; font-size: 12px; font-weight: 800; color: var(--text1); letter-spacing: 0.5px; margin: 0; }
.sem-arrow { font-size: 11px; color: var(--text3); }
.sem-kpis-list { display: flex; flex-direction: column; gap: 5px; }
.sem-kpi-row { display: flex; align-items: center; gap: 5px; }
.sem-kpi-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.sem-kpi-dot.red { background: var(--red); }
.sem-kpi-dot.yellow { background: var(--yellow); }
.sem-kpi-dot.green { background: var(--green); }
.sem-kpi-label { font-size: 10px; color: var(--text2); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sem-kpi-val { font-size: 10px; font-weight: 700; flex-shrink: 0; }
.sem-kpi-val.red { color: var(--red); }
.sem-kpi-val.yellow { color: var(--yellow); }
.sem-kpi-val.green { color: var(--green); }
.sem-kpi-ok { font-size: 10px; color: var(--text3); }
.sem-card::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 4px;
}
.sem-card.red::after { background: var(--red-light); }
.sem-card.yellow::after { background: var(--yellow-light); }
.sem-card.green::after { background: var(--green-light); }
.sem-card:active { transform: scale(0.97); box-shadow: var(--shadow-md); }

.sem-badge {
  display: inline-block;
  font-size: 8px;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 20px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  margin-bottom: 8px;
}
.sem-badge.red { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
.sem-badge.yellow { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
.sem-badge.green { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }

.sem-emoji-big { font-size: 28px; display: block; margin-bottom: 6px; }
.sem-name { font-size: 11px; font-weight: 700; color: var(--text2); letter-spacing: 0.4px; margin-bottom: 4px; }
.sem-kpi { font-size: 10px; color: var(--text3); line-height: 1.3; }

/* ============================
   HOLDING STRIP
   ============================ */
.holding-strip { display: flex; gap: 10px; margin-bottom: 16px; }
.holding-stat {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  box-shadow: var(--shadow);
}
.holding-val { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; color: var(--text); }
.holding-val.danger { color: var(--red); }
.holding-val.warn   { color: var(--yellow); }
.holding-label { font-size: 10px; color: var(--text3); margin-top: 2px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.3px; }

/* ============================
   AGENDA CEO
   ============================ */
.agenda-section { margin-bottom: 16px; }
.agenda-section-header {
  display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
}
.agenda-section-title {
  font-size: 11px; font-weight: 700; color: var(--text2);
  text-transform: uppercase; letter-spacing: 0.6px;
}
.agenda-count {
  font-size: 10px; font-weight: 700;
  padding: 2px 7px; border-radius: 20px; min-width: 20px; text-align: center;
}
.agenda-count.red { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
.agenda-count.yellow { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
.agenda-count.blue { background: var(--accent-bg); color: var(--accent); }
.agenda-divider { flex: 1; height: 1px; background: var(--border); }

.agenda-items { display: flex; flex-direction: column; gap: 6px; }
.agenda-item-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px 12px 17px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.agenda-item-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
}
.agenda-item-card.red::before { background: var(--red-light); }
.agenda-item-card.yellow::before { background: var(--yellow-light); }
.agenda-item-card.blue::before { background: var(--accent); }

.agenda-item-text { font-size: 13px; line-height: 1.5; color: var(--text); }
.agenda-item-meta { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.agenda-tag {
  font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px;
}
.agenda-tag.emp { background: var(--bg3); color: var(--text2); }
.agenda-tag.resp { background: var(--accent-bg); color: var(--accent); }

/* ============================
   SECTION HEADER
   ============================ */
.section-header {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 10px; margin-top: 20px;
}
.section-header:first-child { margin-top: 0; }
.section-header-title {
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.6px;
  color: #1e3a5f; white-space: nowrap;
}
.section-header-line { flex: 1; height: 1px; background: var(--border); }

/* ============================
   KPI GRID
   ============================ */
.kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
.quick-kpi-card { background: var(--bg2); border-radius: 10px; padding: 10px 8px; text-align: center; cursor: pointer; border: 1.5px solid var(--border); transition: transform .1s; }
.quick-kpi-card:active { transform: scale(0.97); }
.quick-kpi-card.sem-red    { border-color: var(--red-border);    background: var(--red-bg); }
.quick-kpi-card.sem-yellow { border-color: var(--yellow-border); background: var(--yellow-bg); }
.quick-kpi-card.sem-green  { border-color: var(--green-border);  background: var(--green-bg); }
.quick-kpi-val   { font-size: 16px; font-weight: 700; color: var(--text); line-height: 1.1; }
.quick-kpi-card.sem-red    .quick-kpi-val { color: var(--red); }
.quick-kpi-card.sem-yellow .quick-kpi-val { color: var(--yellow); }
.quick-kpi-card.sem-green  .quick-kpi-val { color: var(--green); }
.quick-kpi-label { font-size: 10px; color: var(--text2); margin-top: 3px; }
.quick-kpi-meta  { font-size: 9px; color: var(--text3); margin-top: 1px; }
.kpi-card {
  background: var(--card);
  border: 1.5px solid #cbd5e1;
  border-radius: var(--radius);
  padding: 14px 14px 12px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.kpi-card::before { content: none; }
.kpi-card.red, .kpi-card.yellow, .kpi-card.green { border-color: #cbd5e1; }

/* Semáforo dot junto al valor */
.kpi-val-row { display: flex; align-items: center; gap: 10px; margin-bottom: 0; }
.kpi-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
.kpi-dot.red    { background: #ef4444; }
.kpi-dot.yellow { background: #f59e0b; }
.kpi-dot.green  { background: #22c55e; }
.kpi-dot.neutral { background: #94a3b8; }

.kpi-label { font-size: 10px; color: #374151; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; line-height: 1.4; font-weight: 600; }
.kpi-val { font-size: 26px; font-weight: 700; line-height: 1; letter-spacing: -0.5px; color: #1e293b; }
.kpi-val.red, .kpi-val.yellow, .kpi-val.green, .kpi-val.neutral { color: #1e293b; }

.kpi-meta { font-size: 11px; color: #374151; margin-top: 5px; }
.kpi-trend-row { display: flex; align-items: center; gap: 5px; margin-top: 6px; }
.kpi-trend-pill {
  font-size: 10px; font-weight: 500; padding: 0; background: none; border: none;
  color: var(--text3);
}
.kpi-trend-pill.bad  { color: #374151; }
.kpi-trend-pill.good { color: #374151; }
.kpi-trend-pill.flat { color: #374151; }

/* Progress bar — un solo color, el semáforo identifica el estado */
.kpi-progress { margin-top: 8px; }
.kpi-progress-track { height: 3px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
.kpi-progress-fill { height: 100%; border-radius: 3px; background: var(--text3); transition: width 0.5s ease; }
.kpi-progress-fill.red, .kpi-progress-fill.yellow, .kpi-progress-fill.green { background: var(--text3); }
.kpi-progress-meta { font-size: 10px; color: #374151; margin-top: 4px; }

.kpi-card-link { transition: transform 0.1s, box-shadow 0.1s; }
.kpi-card-link:active { transform: scale(0.97); box-shadow: var(--shadow-md); }

/* ============================
   EMPRESA HEADER
   ============================ */
.empresa-header-card {
  border-radius: var(--radius);
  padding: 18px 16px;
  margin-bottom: 16px;
  display: flex; align-items: flex-start; gap: 14px;
  box-shadow: var(--shadow);
}
.empresa-header-card.red    { background: var(--red-bg);    border: 1.5px solid var(--red-border); }
.empresa-header-card.yellow { background: var(--yellow-bg); border: 1.5px solid var(--yellow-border); }
.empresa-header-card.green  { background: var(--green-bg);  border: 1.5px solid var(--green-border); }

.empresa-emoji { font-size: 36px; flex-shrink: 0; }
.empresa-header-info { flex: 1; }
.empresa-nombre { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
.empresa-nombre.red    { color: var(--red); }
.empresa-nombre.yellow { color: var(--yellow); }
.empresa-nombre.green  { color: var(--green); }
.empresa-status { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
.empresa-status.red    { color: var(--red); }
.empresa-status.yellow { color: var(--yellow); }
.empresa-status.green  { color: var(--green); }
.empresa-razon { font-size: 12px; color: var(--text2); margin-top: 5px; line-height: 1.4; }

/* ============================
   REPORTES LIST
   ============================ */
.reportes-list { display: flex; flex-direction: column; gap: 8px; }
.board-call-section { margin-top: 24px; background: #f0f4ff; border: 1.5px solid #1e3a5f; border-radius: 12px; padding: 16px; }
.board-call-header { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #1e3a5f; margin-bottom: 8px; }
.board-call-desc { font-size: 12px; color: #374151; margin: 0 0 14px; line-height: 1.5; }
.board-call-btn { width: 100%; background: #1e3a5f; color: #fff; border: none; border-radius: 8px; padding: 12px 16px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; letter-spacing: 0.3px; }
.board-call-btn:active { opacity: 0.85; }
.board-updated { font-size: 10px; font-weight: 400; color: #6b7280; margin-left: auto; }
.board-objetivo { font-size: 11px; font-weight: 700; color: #1e3a5f; background: #dbeafe; border-radius: 6px; padding: 6px 10px; margin-bottom: 12px; text-align: center; letter-spacing: 0.3px; }
.board-plan-block { margin-bottom: 12px; }
.board-plan-block-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.board-plan-item { font-size: 12px; color: #374151; line-height: 1.5; padding: 3px 0; border-bottom: 1px solid #e5e7eb; }
.reporte-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 13px 14px 13px 18px;
  display: flex; align-items: center; gap: 12px;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform 0.1s, box-shadow 0.1s;
  position: relative; overflow: hidden;
}
.reporte-item::before {
  content: ''; position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
}
.reporte-item.red::before    { background: var(--red-light); }
.reporte-item.yellow::before { background: var(--yellow-light); }
.reporte-item.green::before  { background: var(--green-light); }
.reporte-item.neutral::before { background: var(--bg3); }
.reporte-item:active { transform: scale(0.99); box-shadow: var(--shadow-md); }

.reporte-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.reporte-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon-red    { background: var(--red-bg);    color: var(--red); }
.icon-yellow { background: var(--yellow-bg); color: var(--yellow); }
.icon-green  { background: var(--green-bg);  color: var(--green); }
.icon-neutral{ background: var(--bg3);       color: var(--text2); }

.reporte-info { flex: 1; }
.reporte-name { font-size: 13px; font-weight: 600; color: var(--text); }
.reporte-sub  { font-size: 11px; color: var(--text3); margin-top: 2px; line-height: 1.3; }

.estado-chip {
  font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 20px;
  white-space: nowrap; flex-shrink: 0;
}
.estado-chip.red    { background: var(--red-bg);    color: var(--red);    border: 1px solid var(--red-border); }
.estado-chip.yellow { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
.estado-chip.green  { background: var(--green-bg);  color: var(--green);  border: 1px solid var(--green-border); }
.estado-chip.neutral{ background: var(--bg3);       color: var(--text2); }

/* ============================
   DETAIL — REPORTE
   ============================ */
.detail-reporte-context {
  background: var(--bg3);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  margin-bottom: 14px;
  border-left: 4px solid var(--accent);
}
.detail-reporte-empresa { font-size: 10px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
.detail-reporte-titulo  { font-size: 14px; font-weight: 700; color: var(--text); }
.detail-reporte-desc    { font-size: 11px; color: var(--text2); margin-top: 3px; line-height: 1.4; }

.alert-banner { border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 14px; display: flex; gap: 10px; align-items: flex-start; }
.alert-banner.red    { background: var(--red-bg);    border: 1.5px solid var(--red-border); }
.alert-banner.yellow { background: var(--yellow-bg); border: 1.5px solid var(--yellow-border); }
.alert-icon { font-size: 18px; flex-shrink: 0; }
.alert-text { font-size: 13px; font-weight: 600; line-height: 1.5; }
.alert-banner.red    .alert-text { color: var(--red); }
.alert-banner.yellow .alert-text { color: var(--yellow); }

/* Tramos */
.tramos { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.tramo { flex: 1; min-width: 80px; border-radius: var(--radius-sm); padding: 12px 8px; text-align: center; box-shadow: var(--shadow); }
.tramo.green  { background: var(--green-bg);  border: 1.5px solid var(--green-border); }
.tramo.yellow { background: var(--yellow-bg); border: 1.5px solid var(--yellow-border); }
.tramo.red    { background: var(--red-bg);    border: 1.5px solid var(--red-border); }
.tramo-label  { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; }
.tramo.green  .tramo-label { color: var(--green); }
.tramo.yellow .tramo-label { color: var(--yellow); }
.tramo.red    .tramo-label { color: var(--red); }
.tramo-val { font-size: 16px; font-weight: 700; margin-top: 5px; }
.tramo.green  .tramo-val { color: var(--green); }
.tramo.yellow .tramo-val { color: var(--yellow); }
.tramo.red    .tramo-val { color: var(--red); }
.tramo-sub { font-size: 10px; margin-top: 3px; opacity: 0.75; }
.tramo.green  .tramo-sub { color: var(--green); }
.tramo.yellow .tramo-sub { color: var(--yellow); }
.tramo.red    .tramo-sub { color: var(--red); }

/* Riesgos */
.riesgo-list { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; box-shadow: var(--shadow); }

// Limpiar todo el caché viejo al abrir la app
(async function() {
  try {
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const r of regs) {
        if (r.active && r.active.scriptURL && !r.active.scriptURL.includes('v18')) {
          await r.unregister();
        }
      }
    }
  } catch(e) {}
})();
</script>

function semEmoji(s) { return s === 'red' ? '🔴' : s === 'yellow' ? '🟡' : '🟢'; }
function semLabel(s) { return s === 'red' ? 'CRÍTICO' : s === 'yellow' ? 'ATENCIÓN' : 'OK'; }
function sc(s)       { return s === 'red' ? 'red' : s === 'yellow' ? 'yellow' : s === 'green' ? 'green' : 'neutral'; }

// Determina si una tendencia es "buena" o "mala" dado el tipo de KPI
// Por defecto: sube = malo para mora/dias/vencido; sube = bueno para margen/ventas/cumplimiento
function trendClass(tendencia, label) {
  if (!tendencia) return 'flat';
  const t = tendencia.toLowerCase();
  const lbl = (label || '').toLowerCase();
  // KPIs donde "sube" es malo
  const subeBad = lbl.includes('mora') || lbl.includes('dias') || lbl.includes('cxp') ||
    lbl.includes('vencido') || lbl.includes('merma') || lbl.includes('dead') || lbl.includes('criticos');
  // KPIs donde "baja" es malo
  const bajaGood = !subeBad;
  if (t.includes('sube') || t.includes('crecien') || t.includes('aument')) return subeBad ? 'bad' : 'good';
  if (t.includes('baja') || t.includes('descend') || t.includes('dismin') || t.includes('mejor') || t.includes('reduci')) return subeBad ? 'good' : 'bad';
  return 'flat';
}
function trendArrow(tendencia, label) {
  const cls = trendClass(tendencia, label);
  const t = (tendencia || '').toLowerCase();
  const up = t.includes('sube') || t.includes('crecien') || t.includes('aument');
  const down = t.includes('baja') || t.includes('descend') || t.includes('dismin') || t.includes('mejor') || t.includes('reduci');
  const arrow = up ? '↑' : down ? '↓' : '→';
  return { arrow, cls };
}

function datosValidos(d) {
  if (!d || !d.semaforos || !d.empresas) return false;
  // Acepta si tiene semáforos con al menos una empresa, aunque reportes estén vacíos
  if (Object.keys(d.semaforos).length > 0) return true;
  const emp = Object.values(d.empresas || {})[0] || {};
  const reps = Object.values(emp.reportes || {});
  return reps.some(r => r && r.estado);
}

async function loadData() {
  try {
    document.getElementById('loading-msg').textContent = 'Cargando análisis...';
    const t = Date.now();
    const [r, rb, rr, rh, rc, rhi] = await Promise.all([
      fetch('data/latest/summaries.json?t=' + t),
      fetch('data/latest/board_plans.json?t=' + t).catch(() => null),
      fetch('data/latest/risk_register.json?t=' + t).catch(() => null),
      fetch('data/latest/hitos.json?t=' + t).catch(() => null),
      fetch('data/latest/cashflow.json?t=' + t).catch(() => null),
      fetch('data/historico/historico.json?t=' + t).catch(() => null)
    ]);
    if (!r.ok) throw new Error('Sin datos');
    const fresh = await r.json();
    if (datosValidos(fresh)) {
      DATA = fresh;
      try { localStorage.setItem('jg_summaries_backup', JSON.stringify(fresh)); } catch(e) {}
    } else {
      const backup = localStorage.getItem('jg_summaries_backup');
      if (backup) { DATA = JSON.parse(backup); }
      else throw new Error('Sin datos válidos');
    }
    if (rb && rb.ok) BOARD_PLANS = await rb.json();
    if (rr && rr.ok) RISK_REGISTER = await rr.json();
    if (rh && rh.ok) HITOS = await rh.json();
    if (rc && rc.ok) CASHFLOW = await rc.json();
    if (rhi && rhi.ok) HISTORICO = await rhi.json();
    renderAll();
    document.getElementById('loading-overlay').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
  } catch(e) {
    document.getElementById('loading-msg').textContent = 'Sin datos. El scraper corre a las 7am (días hábiles).';
  }
}

function gapBar(val, meta, inverso) {
  // val y meta como números. inverso=true si menor es mejor (mora, mermas)
  if (!val || !meta) return '';
  const pct = Math.min(100, Math.round((val / meta) * 100));
  const ok   = inverso ? val <= meta : val >= meta;
  const warn  = inverso ? val <= meta * 1.5 : val >= meta * 0.7;
  const color = ok ? 'var(--green)' : warn ? 'var(--yellow)' : 'var(--red)';
  const fill  = inverso ? Math.min(100, Math.round((val / (meta * 2)) * 100)) : pct;
  return `<div style="height:4px;background:var(--border);border-radius:2px;margin-top:4px">
    <div style="height:4px;border-radius:2px;background:${color};width:${fill}%"></div>
  </div>`;
}

function fmtNum(s) {
  // Returns raw number from string like "S/6.42M", "21.1%", "81.7%"
  if (!s) return null;
  const m = s.replace(/[^0-9.]/g,'');
  return parseFloat(m) || null;
}

function buildDecisionMatrix(empresa, reportesData) {
  // Returns array of {prioridad, area, indicador, valor, meta, brecha, impacto, accion, tipo, estado}
  // ordered by severity / $ impact
  const rp = reportesData;
  const kv = (tipo, lbl) => rp[tipo]?.kpis?.find(k=>k.label===lbl)?.valor;
  const items = [];

  // Fill Rate — impacto directo en venta perdida (el más alto en $)
  const fr = fmtNum(kv('fill_rate','Fill Rate'));
  const vp = kv('fill_rate','Venta Perdida');
  if (fr !== null) items.push({
    area:'Supply Chain', indicador:'Fill Rate', valor: kv('fill_rate','Fill Rate')||'—',
    meta:'98%', brecha: fr ? `${(98-fr).toFixed(1)}pp` : '—',
    impacto: vp ? `Venta perdida ${vp}` : `${(98-fr).toFixed(1)}pp bajo meta`,
    accion:'Revisar cobertura de inventario y SKUs sin stock. ¿Qué productos fallan más?',
    tipo:'fill_rate', estado: rp.fill_rate?.estado||'neutral',
    peso: (100 - (fr||0)) * 3   // mayor brecha = mayor peso
  });

  // Morosidad CxC — impacto en caja
  const mora = fmtNum(kv('cuentas_por_cobrar','Morosidad'));
  const pvencer = kv('cuentas_por_cobrar','CxC por vencer');
  if (mora !== null) items.push({
    area:'Cobranzas', indicador:'Morosidad CxC', valor: kv('cuentas_por_cobrar','Morosidad')||'—',
    meta:'5%', brecha: mora ? `${(mora-5).toFixed(1)}pp` : '—',
    impacto: pvencer ? `${pvencer} en riesgo de vencer` : `${mora.toFixed(1)}% sobre meta`,
    accion:'Activar cobranza activa. Evaluar bloqueo de crédito a clientes con >60 días.',
    tipo:'cuentas_por_cobrar', estado: rp.cuentas_por_cobrar?.estado||'neutral',
    peso: (mora||0) * 2
  });

  // Mermas — impacto en costo
  const merma = fmtNum(kv('mermas','Merma Total'));
  if (merma !== null) items.push({
    area:'Operaciones', indicador:'Mermas', valor: kv('mermas','Merma Total')||'—',
    meta:'3%', brecha: merma ? `${(merma-3).toFixed(2)}pp` : '—',
    impacto: `${merma.toFixed(2)}% merma — encima del límite operativo`,
    accion:'Auditar proceso en planta. Identificar turno/línea con mayor pérdida.',
    tipo:'mermas', estado: rp.mermas?.estado||'neutral',
    peso: (merma||0) * 10
  });

  // Avance vs Ppto — riesgo de no cumplir plan
  const av = fmtNum(kv('margen_variable_pag2','Avance vs Ppto'));
  if (av !== null && av < 90) items.push({
    area:'Ventas', indicador:'Avance vs Presupuesto', valor: kv('margen_variable_pag2','Avance vs Ppto')||'—',
    meta:'100%', brecha: av ? `${(100-av).toFixed(0)}pp` : '—',
    impacto: `Riesgo de no alcanzar el presupuesto del mes`,
    accion:'Revisar pipeline con equipo comercial. ¿Dónde está la brecha: volumen o precio?',
    tipo:'margen_variable_pag2', estado: rp.margen_variable_pag2?.estado||'neutral',
    peso: (100 - (av||0)) * 1.5
  });

  // CxP Refinanciado — riesgo financiero
  const cxpV = kv('cuentas_por_pagar','CxP Total');
  const refV = kv('cuentas_por_pagar','Refinanciado');
  const cxpN = parseVal(cxpV), refN = parseVal(refV);
  if (cxpN && refN) {
    const pctRef = Math.round((refN/cxpN)*100);
    if (pctRef > 30) items.push({
      area:'Finanzas', indicador:'CxP Refinanciado', valor: `${pctRef}% refinanciado`,
      meta:'<20%', brecha: `${pctRef-20}pp`,
      impacto: `${fmtM(refN)} en deuda refinanciada de ${fmtM(cxpN)} total`,
      accion:'Negociar plan de pago con proveedores clave. Priorizar vencimientos más próximos.',
      tipo:'cuentas_por_pagar', estado: rp.cuentas_por_pagar?.estado||'neutral',
      peso: pctRef
    });
  }

  // ordenar por peso descendente
  items.sort((a,b) => (b.peso||0) - (a.peso||0));
  return items;
}

function renderEmpresa(empresa, containerId) {
  const el = document.getElementById(containerId);
  const empData    = (DATA.empresas || {})[empresa] || {};

  const reportesData = empData.reportes || {};
  const rp = reportesData;

  const kv = (tipo, lbl) => rp[tipo]?.kpis?.find(k=>k.label===lbl)?.valor || '—';
  const matrix = buildDecisionMatrix(empresa, reportesData);

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderKpiCard(k, contexto, empresa, tipo, archivo, desc) {
  const cls = sc(k.estado);
  const { arrow, cls: tCls } = trendArrow(k.tendencia, k.label);
  const clickable = !!(empresa && tipo && archivo);
  const onclick = clickable
    ? `onclick="showDetail('${empresa}','${tipo}','${contexto || tipo}','${archivo}','${(desc||'').replace(/'/g,"\\'")}')" style="cursor:pointer"`
    : '';

  let progressHtml = '';
  if (k.valor && k.meta) {
    const valN  = parseFloat((k.valor || '').replace(/[^0-9.]/g, ''));
    const metaN = parseFloat((k.meta  || '').replace(/[^0-9.]/g, ''));
    if (!isNaN(valN) && !isNaN(metaN) && metaN > 0) {
      const pct = Math.min(100, Math.round((valN / metaN) * 100));
      progressHtml = `<div class="kpi-progress">
        <div class="kpi-progress-track">
          <div class="kpi-progress-fill ${cls}" style="width:${pct}%"></div>
        </div>
        <div class="kpi-progress-meta">Meta: ${esc(k.meta)} · ${pct}% alcanzado</div>
      </div>`;
    }
  }

  return `<div class="kpi-card ${cls}${clickable ? ' kpi-card-link' : ''}" ${onclick}>
    <div class="kpi-label">${k.label}${contexto ? `<br><span style="opacity:.6;font-size:9px;font-style:italic">${contexto}</span>` : ''}</div>
    <div class="kpi-val-row">
      <div class="kpi-val ${cls}">${k.valor || '—'}</div>
      <div class="kpi-dot ${cls}"></div>
    </div>
    ${k.tendencia ? `<div class="kpi-trend-row">
      <span class="kpi-trend-pill ${tCls}">${arrow} ${k.tendencia}</span>
    </div>` : ''}
    ${k.meta && !progressHtml ? `<div class="kpi-meta">Meta: ${esc(k.meta)}</div>` : ''}
    ${progressHtml}
    ${clickable ? `<div style="margin-top:8px;font-size:10px;color:var(--accent);font-weight:600">Ver detalle →</div>` : ''}
  </div>`;
}

  const cls = sc(k.estado);

  const pregunta = `En el reporte "${reporteLabel}" de ${empresa}, explícame el indicador "${k.label}" que está en ${k.valor}${k.meta ? ` (meta ${k.meta})` : ''}. ¿Qué significa este valor, por qué está en ese nivel y qué debería hacer?`;

// ── Gráficas SVG inline ──────────────────────────────────────────────────────

// Parsea "S/124.89M" → 124890000, "81.7%" → 81.7, "S/3.15M" → 3150000
function parseVal(s) {
  if (!s) return null;
  s = String(s).trim();
  const mM = s.match(/([\d,]+\.?\d*)\s*M/i);
  if (mM) return parseFloat(mM[1].replace(/,/g,'')) * 1e6;
  const mK = s.match(/([\d,]+\.?\d*)\s*K/i);
  if (mK) return parseFloat(mK[1].replace(/,/g,'')) * 1e3;
  return parseFloat(s.replace(/[^0-9.\-]/g,'')) || null;
}

function fmtM(n) { // format soles as "S/X.XXM"
  if (n === null || n === undefined) return '—';
  if (Math.abs(n) >= 1e6) return 'S/' + (n/1e6).toFixed(2) + 'M';
  if (Math.abs(n) >= 1e3) return 'S/' + (n/1e3).toFixed(0) + 'K';
  return 'S/' + n.toFixed(0);
}

// Semicircle gauge (180°): left=0%, right=100%
function svgGauge(pct, label, color, meta) {
  const clamped = Math.max(0, Math.min(100, pct));
  const R = 52, cx = 64, cy = 64;
  // angle in radians: 0% = π (left), 100% = 0 (right), sweep left→right through top
  const ang = Math.PI * (1 - clamped / 100);
  const ex = cx + R * Math.cos(ang);
  const ey = cy - R * Math.sin(ang);
  // track: full semicircle from right (0) to left (π)
  return `<svg viewBox="0 0 128 78" style="width:150px;height:88px;display:block;margin:0 auto">
    <path d="M${cx-R},${cy} A${R},${R} 0 0,1 ${cx+R},${cy}" fill="none" stroke="var(--border)" stroke-width="11" stroke-linecap="round"/>
    <path d="M${cx+R},${cy} A${R},${R} 0 0,0 ${ex.toFixed(1)},${ey.toFixed(1)}" fill="none" stroke="${color}" stroke-width="11" stroke-linecap="round"/>
    <text x="${cx}" y="${cy+2}" text-anchor="middle" font-size="20" font-weight="800" fill="${color}">${pct.toFixed(1)}%</text>
    <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="9" fill="var(--sub)">${label}</text>
    ${meta ? `<text x="${cx}" y="${cy+27}" text-anchor="middle" font-size="8" fill="var(--sub)">meta ${meta}</text>` : ''}
    <text x="${cx-R+2}" y="${cy+14}" font-size="8" fill="var(--sub)">0%</text>
    <text x="${cx+R-14}" y="${cy+14}" font-size="8" fill="var(--sub)">100%</text>
  </svg>`;
}

// Waterfall: items = [{label, valSoles, color}]
function svgWaterfall(items) {
  const maxVal = Math.max(...items.map(i => Math.abs(i.valSoles)));
  if (!maxVal) return '';
  const W = 280, H = 110, padL = 8, bw = 72, gap = 12, padB = 22;
  const scale = (H - padB - 8) / maxVal;
  let bars = '';
  items.forEach((item, i) => {
    const bh = Math.max(4, Math.round(Math.abs(item.valSoles) * scale));
    const x = padL + i * (bw + gap);
    const y = H - padB - bh;
    const lbl = fmtM(item.valSoles);
    bars += `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="4" fill="${item.color}" opacity="0.9"/>
      <text x="${x+bw/2}" y="${y-4}" text-anchor="middle" font-size="10" font-weight="700" fill="${item.color}">${lbl}</text>
      <text x="${x+bw/2}" y="${H-4}" text-anchor="middle" font-size="9" fill="var(--sub)">${item.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:300px;display:block;margin:0 auto">${bars}</svg>`;
}

      ${svgGauge(m, 'Merma Total', col, '3%')}

      </div>

          {palanca:'Alinear compras a consumo real', impacto:'Reducir sobre-stock y capital inmovilizado', accion:'Si ratio <100%: revisar qué materias primas se compran en exceso. Ajustar frecuencia de pedido.', prioridad:'MEDIA', col:'var(--yellow)'},

// ── Análisis McKinsey de Ventas ───────────────────────────────────────────────
function renderVentasMcKinsey(empresa) {
  const rp = (DATA.empresas || {})[empresa]?.reportes || {};
  const kv = (tipo, lbl) => rp[tipo]?.kpis?.find(k => k.label === lbl)?.valor;

  const ventaV  = kv('margen_variable', 'Ventas mes');
  const avanceV = kv('margen_variable_pag2', 'Avance vs Ppto');
  const frV     = kv('fill_rate', 'Fill Rate');
  const vpV     = kv('fill_rate', 'Venta Perdida');
  const ovV     = kv('fill_rate', 'Orden de Venta');

  const venta  = parseVal(ventaV);
  const avance = parseVal(avanceV);   // % e.g. 63
  const vp     = parseVal(vpV);
  const ov     = parseVal(ovV);

  // Derivados
  const ppto   = (venta && avance) ? venta / (avance / 100) : null;
  const gap    = (ppto && venta)   ? ppto - venta            : null;
  const recFR  = (ov && vp)        ? ov * 0.98 - (ov - vp)  : null; // ventas adicionales si FR=98%

  const col = (avance||0) >= 90 ? 'var(--green)' : (avance||0) >= 70 ? 'var(--yellow)' : 'var(--red)';

  // Proyección fin de año: asume agosto es mes 8, mensual promedio = venta actual
  const proySepDic = venta ? venta * 4 : null;

  const mcSection = (n, title, content) => `
    <div style="margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <div style="width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0">${n}</div>
        <div style="font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)">${title}</div>
      </div>
      <div style="padding:12px;background:var(--surface);border-radius:8px;border:1px solid var(--border)">${content}</div>
    </div>`;

  const row2 = (lbl, val, sub, color) => `
    <div style="display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--border)">
      <span style="font-size:11px;color:var(--sub)">${lbl}</span>
      <span style="font-size:13px;font-weight:700;color:${color||'var(--fg)'};">${val}${sub?` <span style="font-size:10px;font-weight:400;color:var(--sub)">${sub}</span>`:''}</span>
    </div>`;

  let html = `
  <!-- HEADLINE KPI -->
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px">
    <div style="padding:14px;background:var(--accent);border-radius:10px;text-align:center">
      <div style="font-size:10px;font-weight:700;letter-spacing:.06em;color:rgba(255,255,255,.7);text-transform:uppercase">Ventas Agosto 2026</div>
      <div style="font-size:24px;font-weight:900;color:#fff;margin-top:4px">${ventaV || '—'}</div>
      <div style="font-size:10px;color:rgba(255,255,255,.7);margin-top:2px">Dato real — Power BI</div>
    </div>
    <div style="padding:14px;background:${col}22;border:1px solid ${col}44;border-radius:10px;text-align:center">
      <div style="font-size:10px;font-weight:700;letter-spacing:.06em;color:${col};text-transform:uppercase">Avance vs Ppto</div>
      <div style="font-size:24px;font-weight:900;color:${col};margin-top:4px">${avanceV || '—'}</div>
      <div style="font-size:10px;color:var(--sub);margin-top:2px">meta 100%</div>
    </div>
    <div style="padding:14px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:10px;text-align:center">
      <div style="font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--red);text-transform:uppercase">Brecha vs Plan</div>
      <div style="font-size:24px;font-weight:900;color:var(--red);margin-top:4px">${gap ? fmtM(gap) : '—'}</div>
      <div style="font-size:10px;color:var(--sub);margin-top:2px">${avance ? (100-avance).toFixed(1)+'pp' : ''} por cerrar</div>
    </div>
  </div>

  <!-- SECCIÓN I: DIAGNÓSTICO -->
  ${mcSection('I','Diagnóstico — ¿Dónde estamos?',`
    <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
      ${avance ? svgGauge(avance, 'Avance agosto', col, '100%') : ''}
      <div style="flex:1;min-width:140px">
        ${row2('Ventas reales agosto 2026', ventaV||'—', '', 'var(--fg)')}
        ${row2('Presupuesto implícito mensual', ppto ? fmtM(ppto) : '—', '(= real ÷ 63%)', 'var(--sub)')}
        ${row2('Brecha absoluta', gap ? fmtM(gap) : '—', 'faltante vs plan', 'var(--red)')}
        ${row2('Avance porcentual', avanceV||'—', 'vs meta 100%', col)}
        <div style="font-size:10px;color:var(--sub);margin-top:8px;padding:6px;background:rgba(0,0,0,.04);border-radius:6px">
          ⚠️ Presupuesto implícito derivado de ${avanceV} avance. Para análisis exacto se requiere el presupuesto absoluto de agosto.
        </div>
      </div>
    </div>
  `)}

  <!-- SECCIÓN II: ANÁLISIS VENTAS 2025 vs 2026 -->
  ${(() => {
    const yoy = DATA.yoy || {};
    const ventaYoY = yoy.ventas;   // número en soles o null
    const periodoYoY = DATA.yoy_periodo || '2025-08';
    const has2025 = ventaYoY !== null && ventaYoY !== undefined;
    const yoyDelta = (has2025 && venta) ? ((venta - ventaYoY) / ventaYoY * 100) : null;
    const yoyColor = yoyDelta !== null ? (yoyDelta >= 0 ? 'var(--green)' : 'var(--red)') : 'var(--sub)';
    return mcSection('II','Ventas 2025 vs 2026 — Comparativo YoY',`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div style="padding:10px;background:rgba(0,0,0,.04);border-radius:8px">
        <div style="font-size:10px;font-weight:700;color:var(--sub);text-transform:uppercase;margin-bottom:6px">Agosto ${periodoYoY.split('-')[0]}</div>

          : `<div style="font-size:20px;font-weight:700;color:var(--sub)">Sin datos</div>
             <div style="font-size:10px;color:var(--sub);margin-top:4px">Ejecutar workflow discover_measures para traer histórico</div>`

      <div style="padding:10px;background:var(--accent)11;border:1px solid var(--accent)33;border-radius:8px">

        <div style="font-size:10px;color:var(--sub);margin-top:4px">Dato real — Power BI</div>
      </div>
    </div>
    ${has2025 && yoyDelta !== null ? `

      <div style="font-size:11px;font-weight:700;color:${yoyColor}">Variación YoY: ${yoyDelta>0?'+':''}${yoyDelta.toFixed(1)}%</div>
      <div style="font-size:11px;color:var(--sub);margin-top:4px">
        ${yoyDelta >= 0

      </div>
    </div>` : has2025 ? '' : `
    <div style="margin-top:10px;padding:8px;background:rgba(234,179,8,.08);border-left:3px solid var(--yellow);border-radius:4px;font-size:11px;color:var(--sub)">
      <strong>Para activar comparativo 2025 vs 2026:</strong> Ejecutar el workflow <code>discover_measures</code> en GitHub Actions. McKinsey recomienda mínimo 24 meses para análisis de tendencia.
    </div>`}
    `);
  })()}

  <!-- SECCIÓN III: ANÁLISIS ACUMULADO -->
  ${mcSection('III','Análisis Acumulado 2026',`
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px">
      ${[
        {lbl:'Ene-Jul 2026', val:'Sin datos', sub:'requiere histórico', col:'var(--sub)'},
        {lbl:'Agosto 2026', val: ventaV||'—', sub:'dato real', col:'var(--accent)'},

function goBack() {
  if (!navHistory.length) { showTab(currentTab); return; }
  const prev = navHistory.pop();
  if (prev.savedHtml !== undefined) {
    const el = document.getElementById(prev.screen);
    if (el) el.innerHTML = prev.savedHtml;
  }
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(prev.screen).classList.add('active');
  document.getElementById('top-title').textContent = prev.tab === 'home' ? 'Juanito Garcia' : prev.tab.toUpperCase();
  document.getElementById('top-badge').textContent = DATA.fecha || '';

// Genera chips de seguimiento según la pregunta respondida
function chipsFollowUp(pregunta) {
  const p = pregunta.toLowerCase();
  if (p.includes('decid') || p.includes('hoy')) {
    return ['¿Cómo está la mora?', '¿Cómo van las compras?', 'Avance vs presupuesto'];
  }
  if (p.includes('mora') || p.includes('cobrar') || p.includes('cxc')) {
    return ['¿Cómo está la caja?', 'Avance vs presupuesto', '¿Cómo está el margen?'];
  }
  if (p.includes('compra') || p.includes('ratio') || p.includes('consumo')) {
    return ['¿Cómo está el inventario?', '¿Qué debo decidir hoy?', '¿Cómo está el margen?'];
  }
  if (p.includes('inventario') || p.includes('stock') || p.includes('s&op') || p.includes('dead')) {
    return ['¿Cómo van las compras?', '¿Qué debo decidir hoy?', 'Avance vs presupuesto'];
  }
  if (p.includes('presupuesto') || p.includes('avance') || p.includes('canal') || p.includes('ppto')) {
    return ['¿Cómo está la mora?', '¿Cómo está el margen?', '¿Qué debo decidir hoy?'];
  }
  if (p.includes('margen') || p.includes('venta') || p.includes('ingreso')) {
    return ['¿Cómo van las compras?', 'Avance vs presupuesto', '¿Cómo está la mora?'];
  }
  if (p.includes('caja') || p.includes('cash') || p.includes('flujo') || p.includes('liquidez')) {
    return ['¿Qué debo decidir hoy?', '¿Cómo está la mora?', '¿Cómo está el margen?'];
  }
  if (p.includes('merma') || p.includes('productividad') || p.includes('planilla')) {
    return ['¿Cómo está el margen?', '¿Cómo van las compras?', '¿Qué debo decidir hoy?'];
  }
  if (p.includes('fill') || p.includes('venta perdida') || p.includes('facturaci')) {
    return ['¿Cómo están las ventas?', '¿Cómo está el margen?', 'Avance vs presupuesto'];
  }
  if (p.includes('pauno')) {
    return ['¿Cómo está la mora?', '¿Cómo van las compras?', 'Avance vs presupuesto'];
  }
  return ['¿Qué debo decidir hoy?', '¿Cómo van las compras?', 'Avance vs presupuesto'];
}

  el.className = 'msg ' + role;
  el.innerHTML = text.replace(/\n/g, '<br>');
  const msgs = document.getElementById('juanito-messages');
  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
  return el;
}

function handleJuanitoKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendJuanito(); } }
function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 100) + 'px'; }

const STOPWORDS = new Set(['como','cómo','está','están','qué','que','debo','hacer','cual','cuál','cuánto','cuanto','para','esta','este','esto','tiene','tienen','puedo','hago','pasa','pasan','más','menos','algo','algo','todo','toda','todos','todas','cada','donde','dónde','cuando','cuándo','algo','algunas','algunos','mucho','muchos','poco','pocos','bien','mal','muy','solo','sólo','pero','también','además','entre','sobre','desde','hasta','durante','mientras','aunque','porque','porqué']);

function buscarRespuestaLocal(pregunta) {
  const qa = DATA?.chat_qa;
  if (!qa || !qa.length) return null;
  // Si la pregunta coincide con un handler de analizarConJuanito, no usar QA local
  const p = pregunta.toLowerCase();
  const tieneHandlerDirecto = p.includes('compra') || p.includes('ratio') || p.includes('consumo') ||
    p.includes('inventario') || p.includes('stock') || p.includes('dead') || p.includes('s&op') ||
    p.includes('productividad') || p.includes('planilla') || p.includes('canal') ||
    p.includes('presupuesto') || p.includes('avance') || p.includes('ppto') ||
    p.includes('merma') || p.includes('mora') || p.includes('cxc') || p.includes('cobr') ||
    p.includes('venta') || p.includes('margen') || p.includes('cxp') || p.includes('pagar') ||
    p.includes('decid') || p.includes('hoy') || p.includes('semana') || p.includes('escal');
  if (tieneHandlerDirecto) return null;
  // Solo usar QA local para preguntas sin handler — umbral alto y solo palabras de contenido
  const scores = qa.map(item => {
    const q = item.pregunta.toLowerCase();
    const palabras = p.split(/\s+/).filter(w => w.length > 4 && !STOPWORDS.has(w));
    if (!palabras.length) return { item, score: 0 };
    const matches = palabras.filter(w => q.includes(w)).length;
    return { item, score: matches / palabras.length };
  });
  scores.sort((a, b) => b.score - a.score);
  if (scores[0].score >= 0.5) return scores[0].item.respuesta;
  return null;
}

function analizarConJuanito(pregunta) {
  const p = pregunta.toLowerCase();
  const d = DATA;
  const sems = d.semaforos || {};
  const razones = d.semaforo_razon || {};
  const agenda = d.agenda_ceo || {};

  // Detectar empresa mencionada
  const emp = p.includes('pauno') ? 'PAUNO' : p.includes('amauta') ? 'AMAUTA' : p.includes('neopack') ? 'NEOPACK' : null;

  const fmt = s => (s||'').replace(/\n/g,'<br>');
  const semIcon = s => s==='red'?'🔴':s==='yellow'?'🟡':'🟢';
  const semTxt  = s => s==='red'?'CRÍTICO':s==='yellow'?'ATENCIÓN':'OK';

  // Función para obtener KPIs clave de una empresa
  function kpisEmpresa(empresa) {
    const ed = (d.empresas||{})[empresa]||{};
    const rpts = REPORTES_CONFIG[empresa]||[];
    const lista = [];
    rpts.forEach(r => {
      const rd = (ed.reportes||{})[r.tipo]||{};
      if (rd.estado && rd.estado !== 'green' && rd.kpis?.length) {
        lista.push({ reporte: r.label, estado: rd.estado, alerta: rd.alerta, kpi: rd.kpis[0] });
      }
    });
    return lista;
  }

  // 1. DECIDIR HOY
  if (p.includes('decid') || p.includes('hoy') || p.includes('urgente') || p.includes('inmedi')) {
    const items = agenda.decidir_hoy || [];
    if (!items.length) return '✅ No hay acciones críticas para decidir hoy según los datos actuales.';
    const por_empresa = {};
    items.forEach(i => { (por_empresa[i.empresa||'General'] = por_empresa[i.empresa||'General']||[]).push(i); });
    let html = `<strong>🔴 DECIDIR HOY — ${items.length} acción${items.length>1?'es':''}</strong><br><br>`;
    items.forEach((i,n) => {
      html += `<strong>${n+1}.</strong> ${i.texto||i.text||''}<br>`;
      if (i.empresa) html += `<span style="font-size:11px;color:var(--text3)">▸ ${i.empresa}${i.responsable?' · '+i.responsable:''}</span><br>`;
      html += '<br>';
    });
    html += `<strong>¿Por qué importa?</strong> Estas acciones tienen impacto directo en liquidez o resultado del mes. Deben resolverse antes del cierre del día.`;
    return html;
  }

  // 2. SITUACIÓN GENERAL / SEMÁFOROS
  if (p.includes('situaci') || p.includes('general') || p.includes('resumen') || p.includes('cómo están') || p.includes('estado')) {
    let html = `<strong>📊 SITUACIÓN HOLDING — ${d.fecha||'hoy'}</strong><br><br>`;
    html += `<strong>Ventas:</strong> ${d.holding_ventas||'—'} &nbsp;|&nbsp; <strong>Mora consolidada:</strong> <span style="color:var(--red)">${d.holding_mora||'—'}</span><br><br>`;
    Object.entries(sems).forEach(([e, s]) => {
      html += `${semIcon(s)} <strong>${e}</strong> — ${semTxt(s)}<br><span style="font-size:12px;color:var(--text2)">${razones[e]||''}</span><br><br>`;
    });
    const critica = Object.entries(sems).find(([e,s])=>s==='red');
    if (critica) html += `<strong>⚡ FOCO INMEDIATO:</strong> ${critica[0]} está en estado crítico. ${razones[critica[0]]||''}`;
    return html;
  }

  // 3. EMPRESA CRÍTICA
  if (p.includes('crític') || p.includes('peor') || p.includes('problema')) {
    const rojas = Object.entries(sems).filter(([e,s])=>s==='red');
    const amarillas = Object.entries(sems).filter(([e,s])=>s==='yellow');
    let html = '';
    if (rojas.length) {
      html += `<strong>🔴 EN ESTADO CRÍTICO:</strong><br>`;
      rojas.forEach(([e,s]) => {
        const kpis = kpisEmpresa(e);
        html += `<br><strong>${e}:</strong> ${razones[e]||''}<br>`;
        kpis.slice(0,3).forEach(k => html += `• ${k.reporte}: ${k.alerta||k.kpi?.valor||''}<br>`);
      });
    }
    if (amarillas.length) {
      html += `<br><strong>🟡 EN ATENCIÓN:</strong><br>`;
      amarillas.forEach(([e,s]) => html += `• ${e}: ${razones[e]||''}<br>`);
    }
    if (!rojas.length && !amarillas.length) html = '🟢 Todas las empresas operan dentro de parámetros normales.';
    return html;
  }

  // 4. MÓDULO 10 — RIESGOS (va primero para capturar "riesgo" antes que otros handlers)
  if (p.includes('riesgo') || p.includes('explota') || p.includes('risk') || p.includes('register') || p.includes('contingencia')) {
    if (!RISK_REGISTER) {
      return `<strong>⚠️ Risk Register no cargado.</strong><br><br>El archivo <code>data/latest/risk_register.json</code> no existe aún.<br><br>Riesgos detectados en el dashboard:<br><br>` + (() => {
        let h = '';
        ['PAUNO','AMAUTA','NEOPACK'].forEach(e => {
          const s = sems[e];
          if (s === 'red' || s === 'yellow') {
            const kpis = kpisEmpresa(e);
            h += `${semIcon(s)} <strong>${e}</strong> — ${razones[e]||''}<br>`;
            kpis.slice(0,2).forEach(k => h += `&nbsp;&nbsp;• ${k.reporte}: ${k.alerta||''}<br>`);
            h += '<br>';
          }
        });
        return h || '🟢 Sin riesgos críticos detectados.';
      })();
    }
    const fecha = RISK_REGISTER.fecha_actualizacion || '';
    let html = `<strong>🔴 RISK REGISTER VIVO — ${fecha}</strong><br><br>`;
    const objetivo = emp ? [emp] : ['PAUNO','AMAUTA','NEOPACK'];
    objetivo.forEach(e => {
      const riesgos = (RISK_REGISTER.empresas?.[e]?.riesgos || []);
      if (!riesgos.length) return;
      html += `<strong>${e}</strong><br>`;
      riesgos.forEach(r => {
        const ic = r.rating==='red'?'🔴':r.rating==='yellow'?'🟡':'🟢';
        html += `${ic} <strong>${r.riesgo}</strong><br>`;
        html += `&nbsp;&nbsp;Prob: ${r.probabilidad} · Impacto: ${r.impacto_soles} · Dueño: ${r.dueno||'⚠ SIN DUEÑO'}<br>`;
        if (r.senal_temprana) html += `&nbsp;&nbsp;📡 Señal: ${r.senal_temprana}<br>`;
        if (r.mitigacion) html += `&nbsp;&nbsp;💡 ${r.mitigacion}<br>`;
        html += '<br>';
      });
    });
    const rojos = Object.values(RISK_REGISTER.empresas||{}).flatMap(e=>(e.riesgos||[]).filter(r=>r.rating==='red'));
    if (rojos.length) {
      html += `<strong>🎯 FOCO CEO esta semana (${rojos.length} riesgo${rojos.length>1?'s':''} 🔴):</strong><br>`;
      rojos.slice(0,3).forEach(r => html += `• ${r.riesgo} — Dueño: ${r.dueno||'ASIGNAR'}<br>`);
    }
    return html;
  }

  // 4b. MÓDULO 11 — HITOS
  if (p.includes('hito') || p.includes('calendario') || p.includes('qué se viene') || p.includes('próximo') || p.includes('vence') || p.includes('plazo') || p.includes('covenant') || p.includes('directorio') || p.includes('cierre')) {
    if (!HITOS) {
      return `<strong>📅 Calendario de Hitos no cargado.</strong><br><br>El archivo <code>data/latest/hitos.json</code> no existe aún.`;
    }
    const fecha = HITOS.fecha_actualizacion || '';
    let html = `<strong>📅 HITOS — PRÓXIMOS 90 DÍAS (${fecha})</strong><br><br>`;
    const hitos = HITOS.hitos || [];
    const pendientes = hitos.filter(h => h.estado !== 'Cerrado');
    const urgentes  = pendientes.filter(h => h.urgente || h.lead_time_activo);
    if (urgentes.length) {
      html += `<strong>⚡ ACTUAR HOY (en ventana de lead time):</strong><br><br>`;
      urgentes.forEach(h => {
        html += `• <strong>${h.hito}</strong> — ${h.fecha_gate}<br>`;
        html += `&nbsp;&nbsp;Acción: ${h.accion_requerida}<br>`;
        if (h.insumo_dueno) html += `&nbsp;&nbsp;Insumo: ${h.insumo_dueno}<br>`;
        html += '<br>';
      });
    }
    html += `<strong>Todos los hitos activos:</strong><br><br>`;
    pendientes.forEach(h => {
      const ic = h.urgente ? '🔴' : h.lead_time_activo ? '🟡' : '🟢';
      html += `${ic} <strong>${h.hito}</strong> [${h.tipo}] — ${h.fecha_gate}<br>`;
      html += `&nbsp;&nbsp;${h.accion_requerida}<br><br>`;
    });
    const vencidos = hitos.filter(h => h.estado === 'Vencido_sin_accion');
    if (vencidos.length) {
      html += `<strong>⛔ VENCIDOS SIN ACCIÓN → pasan a Risk Register:</strong><br>`;
      vencidos.forEach(h => html += `• ${h.hito}<br>`);
    }
    return html;
  }

  // 5. MORA / CxC / COBRANZA
  if (p.includes('mora') || p.includes('cobr') || p.includes('cxc') || p.includes('cartera') || p.includes('vencid')) {
    let html = `<strong>💰 CxC & MORA — ${d.fecha||'hoy'}</strong><br><br>`;
    html += `<strong>Mora consolidada: ${d.holding_mora||'—'}</strong><br><br>`;
    const objetivo = emp ? [emp] : ['PAUNO'];
    objetivo.forEach(e => {
      const rd = ((d.empresas||{})[e]?.reportes||{}).cuentas_por_cobrar || {};
      if (!rd.kpis?.length && !rd.alerta) return;
      html += `${rd.estado==='red'?'🔴':rd.estado==='yellow'?'🟡':'🟢'} <strong>${e}:</strong> ${rd.alerta||''}<br><br>`;
      if (rd.contexto) html += `${rd.contexto}<br><br>`;
      const kpisShow = (rd.kpis||[]).filter(k => !k.label.includes('Ventas')).slice(0,5);
      kpisShow.forEach(k => {
        const ic = k.estado==='red'?'🔴':k.estado==='yellow'?'🟡':'🟢';
        html += `${ic} ${k.label}: <strong>${k.valor}</strong>${k.meta?' (meta '+k.meta+')':''}<br>`;
      });
      if (rd.clientes_criticos?.length) {
        html += `<br><strong>Clientes prioritarios para cobranza:</strong><br>`;
        rd.clientes_criticos.forEach(c => html += `• ${c.nombre}: vencido +30d <strong>${c.vencido30}</strong> · total ${c.total}<br>`);
      }
      if (rd.acciones?.length) {
        html += `<br><strong>💡 Acciones:</strong><br>`;
        rd.acciones.forEach((a,i) => html += `${i+1}. ${a}<br>`);
      }
      html += '<br>';
    });
    return html;
  }

  // 5. VENTAS / MARGEN
  if (p.includes('venta') || p.includes('margen') || p.includes('ingreso') || p.includes('presupuesto') || p.includes('avance')) {
    const objetivo = emp ? [emp] : ['PAUNO','AMAUTA','NEOPACK'];
    let html = `<strong>📈 VENTAS & MARGEN — ${d.fecha||'hoy'}</strong><br><br>`;
    objetivo.forEach(e => {
      const ed = (d.empresas||{})[e]||{};
      const mv = (ed.reportes||{}).margen_variable || (ed.reportes||{}).ventas || {};
      if (!mv.kpis?.length) return;
      html += `<strong>${e}:</strong><br>`;
      (mv.kpis||[]).slice(0,3).forEach(k => html += `&nbsp;&nbsp;• ${k.label}: <strong>${k.valor}</strong>${k.tendencia?' — '+k.tendencia:''}<br>`);
      if (mv.alerta) html += `&nbsp;&nbsp;⚠ ${mv.alerta}<br>`;
      (mv.acciones||[]).slice(0,2).forEach(a => html += `&nbsp;&nbsp;💡 ${a}<br>`);
      html += '<br>';
    });
    if (html === `<strong>📈 VENTAS & MARGEN — ${d.fecha||'hoy'}</strong><br><br>`) html += 'No hay datos de ventas disponibles en el reporte actual.';
    return html;
  }

  // 6. CxP / PROVEEDORES / PAGOS
  if (p.includes('cxp') || p.includes('pagar') || p.includes('proveedor') || p.includes('días de pago') || p.includes('pago')) {
    const objetivo = emp ? [emp] : ['PAUNO','AMAUTA','NEOPACK'];
    let html = `<strong>🏦 CxP & PROVEEDORES — ${d.fecha||'hoy'}</strong><br><br>`;
    objetivo.forEach(e => {
      const rd = ((d.empresas||{})[e]?.reportes||{}).cuentas_por_pagar || {};
      if (!rd.kpis?.length) return;
      html += `<strong>${e}:</strong> ${rd.alerta||''}<br>`;
      (rd.kpis||[]).slice(0,2).forEach(k => html += `&nbsp;&nbsp;• ${k.label}: <strong>${k.valor}</strong> (meta ${k.meta||'—'})<br>`);
      (rd.proveedores_criticos||[]).slice(0,2).forEach(p => html += `&nbsp;&nbsp;⚠ ${p.nombre||''}: ${p.monto||p.pct||''}<br>`);
      html += '<br>';
    });
    return html;
  }

  // 6b. COMPRAS / RATIO CONSUMO
  if (p.includes('compra') || p.includes('ratio') || p.includes('consumo') || p.includes('reposición') || p.includes('materiales')) {
    const rd = ((d.empresas||{}).PAUNO?.reportes||{}).compras || {};
    const ratio = rd.kpis?.find(k => k.label.includes('Total'));
    let html = `<strong>🛒 COMPRAS — RATIO CONSUMO/COMPRA</strong><br><br>`;
    if (rd.alerta) html += `⚠️ <strong>${rd.alerta}</strong><br><br>`;
    if (rd.contexto) html += `${rd.contexto}<br><br>`;
    if (rd.kpis?.length) {
      html += `<strong>Por categoría:</strong><br>`;
      rd.kpis.forEach(k => {
        const ic = k.estado === 'red' ? '🔴' : k.estado === 'yellow' ? '🟡' : '🟢';
        html += `${ic} ${k.label}: <strong>${k.valor}</strong><br>`;
      });
      html += '<br>';
    }
    if (rd.acciones?.length) {
      html += `<strong>💡 Acciones inmediatas:</strong><br>`;
      rd.acciones.forEach((a,i) => html += `${i+1}. ${a}<br>`);
    }
    return html;
  }

  // 6c. PRODUCTIVIDAD / PLANILLA / KG
  if (p.includes('productividad') || p.includes('planilla') || p.includes('producción') || p.includes('eficiencia') || p.includes('rendimiento')) {
    const rd = ((d.empresas||{}).PAUNO?.reportes||{}).productividad || {};
    let html = `<strong>⚙️ PRODUCTIVIDAD PAUNO — ${d.fecha||'hoy'}</strong><br><br>`;
    if (rd.alerta) html += `✅ <strong>${rd.alerta}</strong><br><br>`;
    if (rd.contexto) html += `${rd.contexto}<br><br>`;
    if (rd.kpis?.length) {
      rd.kpis.forEach(k => {
        const ic = k.estado === 'green' ? '🟢' : k.estado === 'yellow' ? '🟡' : '⚪';
        html += `${ic} ${k.label}: <strong>${k.valor}</strong>${k.meta ? ` (meta/ref: ${k.meta})` : ''}<br>`;
      });
      html += '<br>';
    }
    if (rd.acciones?.length) {
      html += `<strong>💡 Recomendaciones:</strong><br>`;
      rd.acciones.forEach((a,i) => html += `${i+1}. ${a}<br>`);
    }
    return html;
  }

  // 6d. FILL RATE
  if (p.includes('fill') || p.includes('fillrate') || p.includes('venta perdida') || p.includes('facturaci')) {
    const rd3 = ((d.empresas||{}).PAUNO?.reportes||{}).fill_rate || {};
    let html = `<strong>📦 FILL RATE — ${d.fecha||'hoy'}</strong><br><br>`;
    if (rd3.alerta) html += `${rd3.estado==='red'?'🔴':'🟡'} <strong>${rd3.alerta}</strong><br><br>`;
    if (rd3.kpis?.length) {
      rd3.kpis.forEach(k => {
        const ic = k.estado==='red'?'🔴':k.estado==='yellow'?'🟡':'🟢';
        html += `${ic} ${k.label}: <strong>${k.valor}</strong>${k.meta ? ` (meta ${k.meta})` : ''}<br>`;
      });
    } else {
      html += 'No hay datos de Fill Rate disponibles.';
    }
    html += `<br><strong>¿Qué es el Fill Rate?</strong><br>Porcentaje de órdenes de venta que se facturaron completas. Bajo 95% indica pedidos no atendidos que generan venta perdida.`;
    return html;
  }

  // 6e. AVANCE PRESUPUESTO / CANAL
  if (p.includes('presupuesto') || p.includes('avance') || p.includes('canal') || p.includes('tradicional') || p.includes('moderno') || p.includes('horeca') || p.includes('ppto')) {
    const rd2 = ((d.empresas||{}).PAUNO?.reportes||{}).margen_variable_pag2 || {};
    let html = `<strong>🎯 AVANCE VENTAS VS PRESUPUESTO — ${d.fecha||'hoy'}</strong><br><br>`;
    if (rd2.alerta) html += `${rd2.estado==='red'?'🔴':'🟡'} <strong>${rd2.alerta}</strong><br><br>`;
    if (rd2.contexto) html += `${rd2.contexto}<br><br>`;
    if (rd2.kpis?.length) {
      html += `<strong>Por canal/marca:</strong><br>`;
      rd2.kpis.forEach(k => {
        if (k.label.includes('Presupuesto') || k.label.includes('Real')) return;
        const ic = k.estado === 'red' ? '🔴' : k.estado === 'yellow' ? '🟡' : '🟢';
        html += `${ic} ${k.label}: <strong>${k.valor}</strong>${k.meta ? ` · meta ${k.meta}` : ''}<br>`;
      });
      html += '<br>';
    }
    if (rd2.acciones?.length) {
      html += `<strong>💡 Acciones urgentes:</strong><br>`;
      rd2.acciones.forEach((a,i) => html += `${i+1}. ${a}<br>`);
    }
    return html;
  }

  // 7. MERMAS
  if (p.includes('merma') || p.includes('pérdida') || p.includes('desperdicio')) {
    const rd = ((d.empresas||{}).PAUNO?.reportes||{}).mermas || {};
    let html = `<strong>⚠️ MERMAS PAUNO — ${d.fecha||'hoy'}</strong><br><br>`;
    if (rd.alerta) html += `${rd.estado==='red'?'🔴':'🟡'} <strong>${rd.alerta}</strong><br><br>`;
    if (rd.contexto) html += `${rd.contexto}<br><br>`;
    (rd.kpis||[]).forEach(k => {
      const ic = k.estado==='red'?'🔴':k.estado==='yellow'?'🟡':'🟢';
      html += `${ic} ${k.label}: <strong>${k.valor}</strong>${k.meta?' (meta '+k.meta+')':''}<br>`;
    });
    if (rd.acciones?.length) {
      html += `<br><strong>💡 Acciones:</strong><br>`;
      rd.acciones.slice(0,3).forEach((a,i) => html += `${i+1}. ${a}<br>`);
    }
    return html || 'No hay datos de mermas disponibles.';
  }

  // 8. INVENTARIO / STOCK
  if (p.includes('inventario') || p.includes('stock') || p.includes('s&op') || p.includes('dead') || p.includes('cobertura')) {
    const objetivo = emp ? [emp] : ['PAUNO'];
    let html = `<strong>📦 INVENTARIO & S&OP — ${d.fecha||'hoy'}</strong><br><br>`;
    objetivo.forEach(e => {
      const ed = (d.empresas||{})[e]||{};
      const rd = (ed.reportes||{}).sop_inventario || (ed.reportes||{}).inventario || {};
      if (!rd.alerta && !rd.kpis?.length) return;
      html += `${rd.estado==='red'?'🔴':rd.estado==='yellow'?'🟡':'⚪'} <strong>${e}:</strong> ${rd.alerta||''}<br><br>`;
      if (rd.contexto) html += `${rd.contexto}<br><br>`;
      const mostrar = (rd.kpis||[]).slice(0,6);
      mostrar.forEach(k => {
        const ic = k.estado==='red'?'🔴':k.estado==='yellow'?'🟡':'🟢';
        html += `${ic} ${k.label}: <strong>${k.valor}</strong>${k.meta?' (meta: '+k.meta+')':''}<br>`;
      });
      if (rd.categorias_criticas?.length) {
        html += `<br><strong>Categorías más críticas:</strong><br>`;
        rd.categorias_criticas.forEach(c => html += `• ${c.categoria}: Dead ${c.dead_pct} · Working ${c.working_pct}<br>`);
      }
      if (rd.acciones?.length) {
        html += `<br><strong>💡 Acciones:</strong><br>`;
        rd.acciones.slice(0,3).forEach((a,i) => html += `${i+1}. ${a}<br>`);
      }
      html += '<br>';
    });
    return html;
  }

  // 9. ANÁLISIS DE EMPRESA ESPECÍFICA
  if (emp) {
    const s = sems[emp] || 'green';
    const kpis = kpisEmpresa(emp);
    let html = `<strong>${semIcon(s)} ${emp} — ${semTxt(s)}</strong><br>`;
    html += `<span style="font-size:12px">${razones[emp]||''}</span><br><br>`;
    if (kpis.length) {
      html += `<strong>Alertas activas:</strong><br>`;
      kpis.forEach(k => {
        html += `• ${semIcon(k.estado)} ${k.reporte}: ${k.alerta||k.kpi?.label+' '+k.kpi?.valor||''}<br>`;
      });
      html += '<br>';
    }
    const escalar = (agenda.escalar_semana||[]).filter(i=>i.empresa===emp);
    if (escalar.length) {
      html += `<strong>🟡 Escalar esta semana:</strong><br>`;
      escalar.forEach(i => html += `• ${i.texto||i.text||''}<br>`);
    }
    return html;
  }

  // 10. CASH FLOW / TESORERÍA
  if (p.includes('caja') || p.includes('cash') || p.includes('tesor') || p.includes('liquidez') || p.includes('flujo') || p.includes('queda sin')) {
    if (!CASHFLOW) {
      return `🟨 <strong>Sin datos de Cash Flow</strong><br><br>El archivo <code>data/latest/cashflow.json</code> aún no existe. Para activar este módulo, el equipo financiero debe subir la proyección de caja en el formato JUANITO.<br><br><strong>Mientras tanto, señales de liquidez desde el dashboard:</strong><br>` + (() => {
        let h = '';
        ['PAUNO','AMAUTA','NEOPACK'].forEach(e => {
          const cxc = (d.empresas?.[e]?.reportes?.cuentas_por_cobrar?.kpis||[]).find(k=>(k.label||'').toLowerCase().includes('mora'));
          const cxp = (d.empresas?.[e]?.reportes?.cuentas_por_pagar?.kpis||[]).find(k=>(k.label||'').toLowerCase().includes('día'));
          if (cxc || cxp) {
            h += `<strong>${e}:</strong> `;
            if (cxc) h += `Mora ${cxc.valor} `;
            if (cxp) h += `· Días CxP ${cxp.valor}`;
            h += '<br>';
          }
        });
        return h || 'Sin datos suficientes.';
      })();
    }
    const cf = CASHFLOW;
    const fecha = cf.fecha_actualizacion || '';
    let html = `<strong>💵 CASH FLOW — ${fecha}</strong><br><br>`;
    html += `<strong>Posición actual:</strong> ${cf.caja_actual||'—'}<br>`;
    html += `<strong>Proyección 30d:</strong> <span style="color:${(cf.proyeccion_30d||'').includes('-')?'var(--red)':'var(--green)'}"><strong>${cf.proyeccion_30d||'—'}</strong></span><br>`;
    html += `<strong>Proyección 60d:</strong> ${cf.proyeccion_60d||'—'}<br><br>`;
    if (cf.alertas?.length) {
      html += `<strong>⚠️ Alertas de caja:</strong><br>`;
      cf.alertas.forEach(a => html += `• ${a}<br>`);
      html += '<br>';
    }
    if (cf.empresas) {
      html += `<strong>Por empresa:</strong><br>`;
      Object.entries(cf.empresas).forEach(([e, ed]) => {
        if (emp && emp !== e) return;
        html += `${e}: Cobros esperados ${ed.cobros_30d||'—'} · Pagos comprometidos ${ed.pagos_30d||'—'}<br>`;
        if (ed.alerta) html += `&nbsp;&nbsp;⚠ ${ed.alerta}<br>`;
      });
    }
    return html;
  }

  // 11. TENDENCIA HISTÓRICA
  if (p.includes('tendencia') || p.includes('históri') || p.includes('mes anterior') || p.includes('evolución') || p.includes('cómo viene') || p.includes('meses')) {
    if (!HISTORICO) {
      return `🟨 <strong>Sin datos históricos</strong><br><br>El archivo <code>data/historico/historico.json</code> aún no existe. Se activa cuando el sistema acumule al menos 2 meses de cierre.<br><br>Hoy solo dispongo del snapshot actual (${d.fecha||'—'}) sin comparativo histórico.`;
    }
    const h = HISTORICO;
    const objetivo = emp ? [emp] : ['PAUNO','AMAUTA','NEOPACK'];
    let html = `<strong>📊 TENDENCIA HISTÓRICA — últimos ${h.meses?.length||0} meses</strong><br><br>`;
    objetivo.forEach(e => {
      const serie = (h.empresas?.[e]?.meses||[]);
      if (!serie.length) return;
      html += `<strong>${e}:</strong><br>`;
      ['ventas','mora','margen'].forEach(kpi => {
        const vals = serie.map(m => m[kpi]).filter(v => v !== undefined && v !== null);
        if (!vals.length) return;
        const labels = serie.map(m => m.mes||'');
        const trend = vals.length >= 2 ? (vals[vals.length-1] > vals[0] ? '↑' : vals[vals.length-1] < vals[0] ? '↓' : '→') : '—';
        html += `&nbsp;&nbsp;${kpi.charAt(0).toUpperCase()+kpi.slice(1)}: `;
        html += serie.map((m,i) => `${m.mes} ${vals[i]}`).join(' → ');
        html += ` ${trend}<br>`;
      });
      html += '<br>';
    });
    return html;
  }

  // 12. ESCALAR / AGENDA SEMANA
  if (p.includes('escal') || p.includes('semana') || p.includes('monitorear')) {
    const items = agenda.escalar_semana || [];
    const mon   = agenda.monitorear || [];
    let html = '';
    if (items.length) {
      html += `<strong>🟡 ESCALAR ESTA SEMANA (${items.length}):</strong><br><br>`;
      items.forEach((i,n) => html += `${n+1}. ${i.texto||i.text||''} <span style="font-size:11px;color:var(--text3)">${i.empresa||''}</span><br><br>`);
    }
    if (mon.length) {
      html += `<strong>🔵 MONITOREAR (${mon.length}):</strong><br><br>`;
      mon.forEach((i,n) => html += `${n+1}. ${i.texto||i.text||''} <span style="font-size:11px;color:var(--text3)">${i.empresa||''}</span><br>`);
    }
    return html || 'No hay items en la agenda de la semana.';
  }

  // FALLBACK: resumen general
  let html = `<strong>📊 HOLDING — ${d.fecha||'hoy'}</strong><br><br>`;
  html += `Ventas: <strong>${d.holding_ventas||'—'}</strong> · Mora: <strong style="color:var(--red)">${d.holding_mora||'—'}</strong><br><br>`;
  Object.entries(sems).forEach(([e,s]) => {
    html += `${semIcon(s)} <strong>${e}:</strong> ${razones[e]||semTxt(s)}<br>`;
  });
  html += '<br>Puedes preguntarme sobre: mora, ventas, margen, CxP, mermas, inventario, o el análisis de una empresa específica.';
  return html;
}

function datosAntiguedad() {
  const fecha = DATA?.fecha || RISK_REGISTER?.fecha_actualizacion || '';
  if (!fecha) return null;
  const ms = Date.now() - new Date(fecha).getTime();
  return Math.floor(ms / 86400000);
}

function bannerFrescura() {
  const dias = datosAntiguedad();
  if (dias === null) return '';
  if (dias > 14) return `<div style="background:#7f1d1d;color:#fca5a5;padding:8px 12px;border-radius:6px;margin-bottom:10px;font-size:12px">⛔ Datos con <strong>${dias} días</strong> de antigüedad — validar antes de tomar decisiones.</div>`;
  if (dias > 7)  return `<div style="background:#78350f;color:#fcd34d;padding:8px 12px;border-radius:6px;margin-bottom:10px;font-size:12px">⚠️ Datos con <strong>${dias} días</strong> de antigüedad — confirmar con equipo.</div>`;
  return `<div style="background:#052e16;color:#86efac;padding:6px 12px;border-radius:6px;margin-bottom:10px;font-size:11px">🟦 Datos al ${DATA?.fecha||''} — fuente confirmada.</div>`;
}

function crossCheckMora() {
  if (!RISK_REGISTER || !DATA) return '';
  const alertas = [];
  ['PAUNO','AMAUTA','NEOPACK'].forEach(e => {
    const moraSummary = parseFloat(((DATA.empresas?.[e]?.reportes?.cuentas_por_cobrar?.kpis||[]).find(k=>(k.label||'').toLowerCase().includes('mora'))?.valor||'0').replace('%','').replace(',','.'));
    const riesgos = RISK_REGISTER.empresas?.[e]?.riesgos || [];
    const moraRiesgo = parseFloat((riesgos.find(r=>(r.riesgo||'').toLowerCase().includes('mora'))?.senal_temprana||'0').match(/(\d+)%/)?.[1]||0);
    if (moraSummary && moraRiesgo && Math.abs(moraSummary - moraRiesgo) > 2) {
      alertas.push(`• ${e}: mora dashboard ${moraSummary}% vs risk register ${moraRiesgo}% — diferencia de ${Math.abs(moraSummary-moraRiesgo).toFixed(1)}pp`);
    }
  });
  if (!alertas.length) return '';
  return `<div style="background:#1e1b4b;color:#c4b5fd;padding:8px 12px;border-radius:6px;margin-bottom:10px;font-size:12px">⚡ <strong>Inconsistencia detectada (mora):</strong><br>${alertas.join('<br>')}<br><span style="font-size:11px">Validar qué fuente es la actualizada.</span></div>`;
}

async function sendJuanito() {
  const input = document.getElementById('juanito-input');
  const text = input.value.trim();
  if (!text || !DATA) return;
  input.value = '';
  input.style.height = 'auto';
  addJuanitoMsg('user', text);
  chatHistorial.push({ rol: 'user', texto: text });

  const send = document.getElementById('juanito-send');
  send.disabled = true;

  // Indicador de escritura animado
  const loadEl = addJuanitoMsg('assistant', '<span class="typing-dots"><span>.</span><span>.</span><span>.</span></span>');
  loadEl.classList.add('loading');

  await new Promise(r => setTimeout(r, 400 + Math.random() * 200));

  const local = buscarRespuestaLocal(text);
  let cuerpo = local ? local.replace(/\n/g, '<br>') : analizarConJuanito(text);

  // Solo mostrar banner y crosscheck en la primera respuesta de la sesión
  const esPrimera = chatHistorial.filter(m => m.rol === 'assistant').length === 0;
  const prefijo = esPrimera ? bannerFrescura() + crossCheckMora() : '';

  // Agregar chips de seguimiento al final
  const followUp = chipsFollowUp(text);
  const chipsHtml = '<div class="chat-chips" style="margin-top:12px">' +
    followUp.map(s => `<button class="chat-chip" onclick="usarChipJuanito('${s}')">${s}</button>`).join('') +
    '</div>';

  loadEl.innerHTML = prefijo + cuerpo + chipsHtml;
  loadEl.classList.remove('loading');
  chatHistorial.push({ rol: 'assistant', texto: cuerpo.replace(/<[^>]*>/g,'').substring(0, 200) });
  send.disabled = false;

  // Scroll al último mensaje
  const msgs = document.getElementById('juanito-messages');
  msgs.scrollTop = msgs.scrollHeight;
}

// Contexto compacto — solo datos clave, sin tendencias históricas largas
function construirContexto() {
  const d = DATA;
  const obj = {
    fecha: d.fecha,
    semaforos: d.semaforos,
    semaforo_razon: d.semaforo_razon,
    holding_ventas: d.holding_ventas,
    holding_mora: d.holding_mora,
    agenda_ceo: d.agenda_ceo,
    empresas: {}
  };
  // Por cada empresa: solo alertas + KPIs (sin tendencia histórica)
  Object.entries(d.empresas || {}).forEach(([emp, ed]) => {
    obj.empresas[emp] = { reportes: {} };
    Object.entries(ed.reportes || {}).forEach(([tipo, rd]) => {
      obj.empresas[emp].reportes[tipo] = {
        estado: rd.estado,
        alerta: rd.alerta,
        kpis: rd.kpis,
        acciones: (rd.acciones || []).slice(0, 3),
        riesgos: (rd.riesgos || []).slice(0, 3),
        proveedores_criticos: (rd.proveedores_criticos || []).slice(0, 3),
        tramos: rd.tramos,
        por_gerente: rd.por_gerente,
        por_uen: rd.por_uen,
        por_canal: rd.por_canal,
        por_categoria: rd.por_categoria
        // excluimos tendencia_* para reducir tamaño
      };
    });
  });
  return JSON.stringify(obj);
}

loadData();

  navigator.serviceWorker.register('./sw.js?v=18').then(r => r.update());
