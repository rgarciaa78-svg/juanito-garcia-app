<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Juanito">
<meta name="theme-color" content="#f5f5f7">
<title>Juanito Garcia</title>
<style>
:root {
  --bg:     #f2f2f7;
  --bg2:    #ffffff;
  --bg3:    #e8e8ed;
  --card:   #ffffff;
  --card2:  #f5f5f7;
  --border: rgba(0,0,0,0.09);
  --shadow: 0 1px 4px rgba(0,0,0,0.08), 0 0 1px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.06);
  --text:   #1c1c1e;
  --text2:  rgba(0,0,0,0.5);
  --text3:  rgba(0,0,0,0.3);
  --red:    #d32f2f;
  --red-light: #ef5350;
  --red-bg: #ffebee;
  --red-border: rgba(211,47,47,0.25);
  --yellow: #e65100;
  --yellow-light: #f57c00;
  --yellow-bg: #fff3e0;
  --yellow-border: rgba(230,81,0,0.25);
  --green:  #2e7d32;
  --green-light: #388e3c;
  --green-bg: #e8f5e9;
  --green-border: rgba(46,125,50,0.25);
  --accent: #1565c0;
  --accent-bg: #e3f2fd;
  --nav-h: 64px;
  --top-h: 56px;
  --radius: 14px;
  --radius-sm: 10px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; -webkit-font-smoothing: antialiased; }

/* LAYOUT */
#app { display: flex; flex-direction: column; height: 100%; }
#top-bar { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; gap: 12px; min-height: var(--top-h); flex-shrink: 0; }
#top-bar .back-btn { background: none; border: none; color: var(--accent); font-size: 26px; cursor: pointer; padding: 4px 2px; display: none; align-items: center; line-height: 1; }
#top-bar .back-btn.visible { display: flex; }
#top-title { font-size: 17px; font-weight: 700; flex: 1; letter-spacing: -0.3px; color: var(--text); }
#top-sub { font-size: 11px; color: var(--text3); }
#top-badge { font-size: 10px; font-weight: 600; background: var(--bg3); color: var(--text2); padding: 4px 10px; border-radius: 20px; white-space: nowrap; }

#main { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
#nav-bar { background: var(--bg2); border-top: 1px solid var(--border); display: flex; min-height: var(--nav-h); flex-shrink: 0; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; padding: 8px 4px; transition: opacity 0.15s; }
.nav-item svg { width: 22px; height: 22px; stroke: var(--text3); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.15s; }
.nav-item span { font-size: 10px; font-weight: 500; color: var(--text3); transition: color 0.15s; }
.nav-item.active svg { stroke: var(--accent); }
.nav-item.active span { color: var(--accent); }

/* iPad */
@media (min-width: 768px) {
  #app { flex-direction: row; }
  #nav-bar { flex-direction: column; width: 80px; min-height: unset; border-top: none; border-right: 1px solid var(--border); }
  .nav-item { padding: 18px 8px; }
  #top-bar { display: none; }
  #ipad-sidebar-header { display: flex; flex-direction: column; align-items: center; padding: 24px 8px 16px; border-bottom: 1px solid var(--border); }
  #ipad-sidebar-header .logo-text { font-size: 11px; font-weight: 800; color: var(--accent); letter-spacing: 1px; writing-mode: vertical-rl; transform: rotate(180deg); margin-bottom: 8px; }
  #left-panel { display: flex; flex-direction: column; }
  #right-panel { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #main { display: flex; flex: 1; overflow: hidden; }
  .mobile-header { display: none !important; }
}
@media (max-width: 767px) {
  #ipad-sidebar-header { display: none; }
  #left-panel, #right-panel { display: none !important; }
  #right-panel.mobile-active { display: block !important; }
}

/* SCREENS */
.screen { display: none; padding: 16px 14px 24px; }
.screen.active { display: block; }
@media (min-width: 768px) {
  .screen { padding: 24px 24px 32px; }
  #screen-home { grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  #screen-home.active { display: grid; }
  .home-col-right { display: flex; flex-direction: column; gap: 16px; }
}

/* ============================
   SEMÁFOROS
   ============================ */
.semaforos { display: flex; gap: 10px; margin-bottom: 12px; }
.sem-card {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 12px 14px;
  text-align: left;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform 0.12s, box-shadow 0.12s;
  position: relative;
  overflow: hidden;
}
.sem-card-top { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
.sem-card-top .sem-name { flex: 1; font-size: 12px; font-weight: 800; color: var(--text1); letter-spacing: 0.5px; margin: 0; }
.sem-arrow { font-size: 11px; color: var(--text3); }
.sem-kpis-list { display: flex; flex-direction: column; gap: 5px; }
.sem-kpi-row { display: flex; align-items: center; gap: 5px; }
.sem-kpi-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.sem-kpi-dot.red { background: var(--red); }
.sem-kpi-dot.yellow { background: var(--yellow); }
.sem-kpi-dot.green { background: var(--green); }
.sem-kpi-label { font-size: 10px; color: var(--text2); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sem-kpi-val { font-size: 10px; font-weight: 700; flex-shrink: 0; }
.sem-kpi-val.red { color: var(--red); }
.sem-kpi-val.yellow { color: var(--yellow); }
.sem-kpi-val.green { color: var(--green); }
.sem-kpi-ok { font-size: 10px; color: var(--text3); }
.sem-card::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 4px;
}
.sem-card.red::after { background: var(--red-light); }
.sem-card.yellow::after { background: var(--yellow-light); }
.sem-card.green::after { background: var(--green-light); }
.sem-card:active { transform: scale(0.97); box-shadow: var(--shadow-md); }

.sem-badge {
  display: inline-block;
  font-size: 8px;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 20px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  margin-bottom: 8px;
}
.sem-badge.red { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
.sem-badge.yellow { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
.sem-badge.green { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }

.sem-emoji-big { font-size: 28px; display: block; margin-bottom: 6px; }
.sem-name { font-size: 11px; font-weight: 700; color: var(--text2); letter-spacing: 0.4px; margin-bottom: 4px; }
.sem-kpi { font-size: 10px; color: var(--text3); line-height: 1.3; }

/* ============================
   HOLDING STRIP
   ============================ */
.holding-strip { display: flex; gap: 10px; margin-bottom: 16px; }
.holding-stat {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  box-shadow: var(--shadow);
}
.holding-val { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; color: var(--text); }
.holding-val.danger { color: var(--red); }
.holding-label { font-size: 10px; color: var(--text3); margin-top: 2px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.3px; }

/* ============================
   AGENDA CEO
   ============================ */
.agenda-section { margin-bottom: 16px; }
.agenda-section-header {
  display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
}
.agenda-section-title {
  font-size: 11px; font-weight: 700; color: var(--text2);
  text-transform: uppercase; letter-spacing: 0.6px;
}
.agenda-count {
  font-size: 10px; font-weight: 700;
  padding: 2px 7px; border-radius: 20px; min-width: 20px; text-align: center;
}
.agenda-count.red { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
.agenda-count.yellow { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
.agenda-count.blue { background: var(--accent-bg); color: var(--accent); }
.agenda-divider { flex: 1; height: 1px; background: var(--border); }

.agenda-items { display: flex; flex-direction: column; gap: 6px; }
.agenda-item-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px 12px 17px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.agenda-item-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
}
.agenda-item-card.red::before { background: var(--red-light); }
.agenda-item-card.yellow::before { background: var(--yellow-light); }
.agenda-item-card.blue::before { background: var(--accent); }

.agenda-item-text { font-size: 13px; line-height: 1.5; color: var(--text); }
.agenda-item-meta { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.agenda-tag {
  font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px;
}
.agenda-tag.emp { background: var(--bg3); color: var(--text2); }
.agenda-tag.resp { background: var(--accent-bg); color: var(--accent); }

/* ============================
   SECTION HEADER
   ============================ */
.section-header {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 10px; margin-top: 20px;
}
.section-header:first-child { margin-top: 0; }
.section-header-title {
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.6px;
  color: var(--text2); white-space: nowrap;
}
.section-header-line { flex: 1; height: 1px; background: var(--border); }

/* ============================
   KPI GRID
   ============================ */
.kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
.kpi-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 14px 12px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.kpi-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
}
.kpi-card.red::before { background: var(--red-light); }
.kpi-card.yellow::before { background: var(--yellow-light); }
.kpi-card.green::before { background: var(--green-light); }

.kpi-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; line-height: 1.4; }
.kpi-val { font-size: 26px; font-weight: 700; line-height: 1; letter-spacing: -0.5px; }
.kpi-val.red { color: var(--red); }
.kpi-val.yellow { color: var(--yellow); }
.kpi-val.green { color: var(--green); }
.kpi-val.neutral { color: var(--text); }

.kpi-meta { font-size: 11px; color: var(--text3); margin-top: 5px; }
.kpi-trend-row { display: flex; align-items: center; gap: 5px; margin-top: 6px; }
.kpi-trend-pill {
  font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px;
}
.kpi-trend-pill.bad  { background: var(--red-bg);    color: var(--red);    border: 1px solid var(--red-border); }
.kpi-trend-pill.good { background: var(--green-bg);  color: var(--green);  border: 1px solid var(--green-border); }
.kpi-trend-pill.flat { background: var(--bg3);       color: var(--text2); }

/* Progress bar */
.kpi-progress { margin-top: 8px; }
.kpi-progress-track { height: 5px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
.kpi-progress-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
.kpi-progress-fill.red    { background: var(--red-light); }
.kpi-progress-fill.yellow { background: var(--yellow-light); }
.kpi-progress-fill.green  { background: var(--green-light); }
.kpi-progress-meta { font-size: 10px; color: var(--text3); margin-top: 3px; }

.kpi-card-link { transition: transform 0.1s, box-shadow 0.1s; }
.kpi-card-link:active { transform: scale(0.97); box-shadow: var(--shadow-md); }

/* ============================
   EMPRESA HEADER
   ============================ */
.empresa-header-card {
  border-radius: var(--radius);
  padding: 18px 16px;
  margin-bottom: 16px;
  display: flex; align-items: flex-start; gap: 14px;
  box-shadow: var(--shadow);
}
.empresa-header-card.red    { background: var(--red-bg);    border: 1.5px solid var(--red-border); }
.empresa-header-card.yellow { background: var(--yellow-bg); border: 1.5px solid var(--yellow-border); }
.empresa-header-card.green  { background: var(--green-bg);  border: 1.5px solid var(--green-border); }

.empresa-emoji { font-size: 36px; flex-shrink: 0; }
.empresa-header-info { flex: 1; }
.empresa-nombre { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
.empresa-nombre.red    { color: var(--red); }
.empresa-nombre.yellow { color: var(--yellow); }
.empresa-nombre.green  { color: var(--green); }
.empresa-status { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
.empresa-status.red    { color: var(--red); }
.empresa-status.yellow { color: var(--yellow); }
.empresa-status.green  { color: var(--green); }
.empresa-razon { font-size: 12px; color: var(--text2); margin-top: 5px; line-height: 1.4; }

/* ============================
   REPORTES LIST
   ============================ */
.reportes-list { display: flex; flex-direction: column; gap: 8px; }
.reporte-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 13px 14px 13px 18px;
  display: flex; align-items: center; gap: 12px;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform 0.1s, box-shadow 0.1s;
  position: relative; overflow: hidden;
}
.reporte-item::before {
  content: ''; position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
}
.reporte-item.red::before    { background: var(--red-light); }
.reporte-item.yellow::before { background: var(--yellow-light); }
.reporte-item.green::before  { background: var(--green-light); }
.reporte-item.neutral::before { background: var(--bg3); }
.reporte-item:active { transform: scale(0.99); box-shadow: var(--shadow-md); }

.reporte-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.reporte-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon-red    { background: var(--red-bg);    color: var(--red); }
.icon-yellow { background: var(--yellow-bg); color: var(--yellow); }
.icon-green  { background: var(--green-bg);  color: var(--green); }
.icon-neutral{ background: var(--bg3);       color: var(--text2); }

.reporte-info { flex: 1; }
.reporte-name { font-size: 13px; font-weight: 600; color: var(--text); }
.reporte-sub  { font-size: 11px; color: var(--text3); margin-top: 2px; line-height: 1.3; }

.estado-chip {
  font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 20px;
  white-space: nowrap; flex-shrink: 0;
}
.estado-chip.red    { background: var(--red-bg);    color: var(--red);    border: 1px solid var(--red-border); }
.estado-chip.yellow { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
.estado-chip.green  { background: var(--green-bg);  color: var(--green);  border: 1px solid var(--green-border); }
.estado-chip.neutral{ background: var(--bg3);       color: var(--text2); }

/* ============================
   DETAIL — REPORTE
   ============================ */
.detail-reporte-context {
  background: var(--bg3);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  margin-bottom: 14px;
  border-left: 4px solid var(--accent);
}
.detail-reporte-empresa { font-size: 10px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
.detail-reporte-titulo  { font-size: 14px; font-weight: 700; color: var(--text); }
.detail-reporte-desc    { font-size: 11px; color: var(--text2); margin-top: 3px; line-height: 1.4; }

.alert-banner { border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 14px; display: flex; gap: 10px; align-items: flex-start; }
.alert-banner.red    { background: var(--red-bg);    border: 1.5px solid var(--red-border); }
.alert-banner.yellow { background: var(--yellow-bg); border: 1.5px solid var(--yellow-border); }
.alert-icon { font-size: 18px; flex-shrink: 0; }
.alert-text { font-size: 13px; font-weight: 600; line-height: 1.5; }
.alert-banner.red    .alert-text { color: var(--red); }
.alert-banner.yellow .alert-text { color: var(--yellow); }

/* Tramos */
.tramos { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.tramo { flex: 1; min-width: 80px; border-radius: var(--radius-sm); padding: 12px 8px; text-align: center; box-shadow: var(--shadow); }
.tramo.green  { background: var(--green-bg);  border: 1.5px solid var(--green-border); }
.tramo.yellow { background: var(--yellow-bg); border: 1.5px solid var(--yellow-border); }
.tramo.red    { background: var(--red-bg);    border: 1.5px solid var(--red-border); }
.tramo-label  { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; }
.tramo.green  .tramo-label { color: var(--green); }
.tramo.yellow .tramo-label { color: var(--yellow); }
.tramo.red    .tramo-label { color: var(--red); }
.tramo-val { font-size: 16px; font-weight: 700; margin-top: 5px; }
.tramo.green  .tramo-val { color: var(--green); }
.tramo.yellow .tramo-val { color: var(--yellow); }
.tramo.red    .tramo-val { color: var(--red); }
.tramo-sub { font-size: 10px; margin-top: 3px; opacity: 0.75; }
.tramo.green  .tramo-sub { color: var(--green); }
.tramo.yellow .tramo-sub { color: var(--yellow); }
.tramo.red    .tramo-sub { color: var(--red); }

/* Riesgos */
.riesgo-list { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; box-shadow: var(--shadow); }
.riesgo-row { display: flex; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--border); gap: 10px; }
.riesgo-row:last-child { border-bottom: none; }
.riesgo-rank { font-size: 12px; font-weight: 700; color: var(--text3); width: 20px; text-align: center; flex-shrink: 0; }
.riesgo-info { flex: 1; min-width: 0; }
.riesgo-name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.riesgo-sub  { font-size: 10px; color: var(--text3); margin-top: 1px; }
.riesgo-val  { font-size: 14px; font-weight: 700; text-align: right; }
.riesgo-val.red    { color: var(--red); }
.riesgo-val.yellow { color: var(--yellow); }
.riesgo-sub-right { font-size: 10px; color: var(--text3); text-align: right; }

/* Gerentes */
.gerente-row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.gerente-row:last-child { border-bottom: none; }
.gerente-info { flex: 1; }
.gerente-name { font-size: 13px; font-weight: 600; color: var(--text); }
.gerente-bar-track { height: 6px; background: var(--bg3); border-radius: 3px; margin-top: 6px; overflow: hidden; }
.gerente-bar-fill  { height: 100%; border-radius: 3px; }
.gerente-pct { font-size: 14px; font-weight: 700; width: 52px; text-align: right; flex-shrink: 0; }

/* Desglose */
.breakdown-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
.breakdown-item { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 13px; box-shadow: var(--shadow); }
.breakdown-label { font-size: 10px; color: var(--text3); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.3px; }
.breakdown-val { font-size: 20px; font-weight: 700; }
.breakdown-val.red    { color: var(--red); }
.breakdown-val.yellow { color: var(--yellow); }
.breakdown-val.green  { color: var(--green); }
.breakdown-val.neutral{ color: var(--text); }
.breakdown-sub { font-size: 10px; color: var(--text3); margin-top: 3px; }

/* Tendencia */
.tend-chart { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 14px 12px; margin-bottom: 14px; box-shadow: var(--shadow); }
.tend-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
.tend-chart-label { font-size: 11px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: 0.4px; }
.tend-trend-text { font-size: 12px; font-weight: 700; }

function semEmoji(s) { return s === 'red' ? '🔴' : s === 'yellow' ? '🟡' : '🟢'; }

// Determina si una tendencia es "buena" o "mala" dado el tipo de KPI
// Por defecto: sube = malo para mora/dias/vencido; sube = bueno para margen/ventas/cumplimiento
function trendClass(tendencia, label) {
  if (!tendencia) return 'flat';
  const t = tendencia.toLowerCase();
  const lbl = (label || '').toLowerCase();
  // KPIs donde "sube" es malo
  const subeBad = lbl.includes('mora') || lbl.includes('dias') || lbl.includes('cxp') ||
    lbl.includes('vencido') || lbl.includes('merma') || lbl.includes('dead') || lbl.includes('criticos');
  // KPIs donde "baja" es malo
  const bajaGood = !subeBad;
  if (t.includes('sube') || t.includes('crecien') || t.includes('aument')) return subeBad ? 'bad' : 'good';
  if (t.includes('baja') || t.includes('descend') || t.includes('dismin') || t.includes('mejor') || t.includes('reduci')) return subeBad ? 'good' : 'bad';
  return 'flat';
}
function trendArrow(tendencia, label) {
  const cls = trendClass(tendencia, label);
  const t = (tendencia || '').toLowerCase();
  const up = t.includes('sube') || t.includes('crecien') || t.includes('aument');
  const down = t.includes('baja') || t.includes('descend') || t.includes('dismin') || t.includes('mejor') || t.includes('reduci');
  const arrow = up ? '↑' : down ? '↓' : '→';
  return { arrow, cls };
}

async function loadData() {
  try {
    document.getElementById('loading-msg').textContent = 'Cargando análisis...';
    const r = await fetch('data/latest/summaries.json?t=' + Date.now());
    if (!r.ok) throw new Error('Sin datos');
    DATA = await r.json();
    renderAll();
    document.getElementById('loading-overlay').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
  } catch(e) {
    document.getElementById('loading-msg').textContent = 'Sin datos. El scraper corre a las 7am (días hábiles).';
  }
}

function renderHome() {
  const sems   = DATA.semaforos || {};

  document.getElementById('semaforos-row').innerHTML = Object.entries(sems).map(([emp, s]) => {
    // Recoger KPIs críticos de esta empresa en orden de prioridad
    const empData = (DATA.empresas || {})[emp] || {};
    const rpts = REPORTES_CONFIG[emp] || [];
    const criticos = [];
    rpts.forEach(r => {
      const rd = (empData.reportes || {})[r.tipo] || {};
      (rd.kpis || []).forEach(k => {
        if (k.estado === 'red' || k.estado === 'yellow') {
          criticos.push({...k, _rpt: r.label});
        }
      });
    });
    criticos.sort((a,b) => (a.estado==='red'?0:1)-(b.estado==='red'?0:1));
    const top = criticos.slice(0,4);

        <span class="sem-kpi-label">${k.label}</span>
        <span class="sem-kpi-val ${k.estado}">${k.valor}</span>
      </div>`).join('');
    return `<div class="sem-card ${s}" onclick="showTab('${emp.toLowerCase()}')">

        <span class="sem-name">${emp}</span>

      </div>
      <div class="sem-kpis-list">${kpisHtml || `<div class="sem-kpi-ok">Sin alertas críticas</div>`}</div>

  document.getElementById('h-ventas').textContent = DATA.holding_ventas || '—';
  document.getElementById('h-mora').textContent   = DATA.holding_mora   || '—';

  const agenda = DATA.agenda_ceo || {};
  renderAgendaSection('agenda-decidir-section',    '🔴 Decidir hoy',          'red',    agenda.decidir_hoy   || []);
  renderAgendaSection('agenda-semana-section',     '🟡 Escalar esta semana',  'yellow', agenda.escalar_semana || []);

      }).join('')}

}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderKpiCard(k, contexto, empresa, tipo, archivo, desc) {
  const cls = sc(k.estado);
  const { arrow, cls: tCls } = trendArrow(k.tendencia, k.label);
  const clickable = !!(empresa && tipo && archivo);
  const onclick = clickable
    ? `onclick="showDetail('${empresa}','${tipo}','${contexto || tipo}','${archivo}','${(desc||'').replace(/'/g,"\\'")}')" style="cursor:pointer"`
    : '';

  let progressHtml = '';
  if (k.valor && k.meta) {
    const valN  = parseFloat((k.valor || '').replace(/[^0-9.]/g, ''));
    const metaN = parseFloat((k.meta  || '').replace(/[^0-9.]/g, ''));
    if (!isNaN(valN) && !isNaN(metaN) && metaN > 0) {
      const pct = Math.min(100, Math.round((valN / metaN) * 100));
      progressHtml = `<div class="kpi-progress">
        <div class="kpi-progress-track">
          <div class="kpi-progress-fill ${cls}" style="width:${pct}%"></div>
        </div>
        <div class="kpi-progress-meta">Meta: ${esc(k.meta)} · ${pct}% alcanzado</div>
      </div>`;
    }
  }

  return `<div class="kpi-card ${cls}${clickable ? ' kpi-card-link' : ''}" ${onclick}>
    <div class="kpi-label">${k.label}${contexto ? `<br><span style="opacity:.6;font-size:9px;font-style:italic">${contexto}</span>` : ''}</div>
    <div class="kpi-val ${cls}">${k.valor || '—'}</div>
    ${k.tendencia ? `<div class="kpi-trend-row">
      <span class="kpi-trend-pill ${tCls}">${arrow} ${k.tendencia}</span>
    </div>` : ''}
    ${k.meta && !progressHtml ? `<div class="kpi-meta">Meta: ${esc(k.meta)}</div>` : ''}
    ${progressHtml}
    ${clickable ? `<div style="margin-top:8px;font-size:10px;color:var(--accent);font-weight:600">Ver detalle →</div>` : ''}
  </div>`;
}

// KPI card en vista de detalle — clickeable para abrir chat con análisis profundo
function renderKpiCardDetail(k, empresa, reporteLabel, reporteDesc) {
  const cls = sc(k.estado);
  const { arrow, cls: tCls } = trendArrow(k.tendencia, k.label);
  const pregunta = `En el reporte "${reporteLabel}" de ${empresa}, explícame el indicador "${k.label}" que está en ${k.valor}${k.meta ? ` (meta ${k.meta})` : ''}. ¿Qué significa este valor, por qué está en ese nivel y qué debería hacer?`;

  let progressHtml = '';
  if (k.valor && k.meta) {
    const valN  = parseFloat((k.valor||'').replace(/[^0-9.]/g,''));
    const metaN = parseFloat((k.meta ||'').replace(/[^0-9.]/g,''));
    if (!isNaN(valN) && !isNaN(metaN) && metaN > 0) {
      const pct = Math.min(100, Math.round((valN / metaN) * 100));
      progressHtml = `<div class="kpi-progress">
        <div class="kpi-progress-track"><div class="kpi-progress-fill ${cls}" style="width:${pct}%"></div></div>
        <div class="kpi-progress-meta">Meta: ${esc(k.meta)} · ${pct}% alcanzado</div>
      </div>`;
    }
  }

  // Escapar la pregunta para uso en data attribute (evita romper el HTML con " o >)
  const safeAttr = s => s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  return `<div class="kpi-card ${cls} kpi-card-link" data-pregunta="${safeAttr(pregunta)}" onclick="openChatWithMsg(this.dataset.pregunta)">
    <div class="kpi-label">${k.label}</div>
    <div class="kpi-val ${cls}">${k.valor || '—'}</div>
    ${k.tendencia ? `<div class="kpi-trend-row"><span class="kpi-trend-pill ${tCls}">${arrow} ${k.tendencia}</span></div>` : ''}
    ${k.meta && !progressHtml ? `<div class="kpi-meta">Meta: ${esc(k.meta)}</div>` : ''}
    ${progressHtml}
    <div style="margin-top:8px;font-size:10px;color:var(--accent);font-weight:600">💬 Preguntarle a Juanito →</div>
  </div>`;
}

function showDetail(empresa, tipo, label, archivo, desc) {
  navHistory.push({ screen: 'screen-' + currentTab, tab: currentTab });
  const empData = (DATA.empresas || {})[empresa] || {};
  const rd = (empData.reportes || {})[tipo] || {};

  let html = '';

  // CONTEXTO: qué reporte es y qué mide
  html += `<div class="detail-reporte-context">
    <div class="detail-reporte-empresa">${empresa}</div>
    <div class="detail-reporte-titulo">${label}</div>
    ${desc ? `<div class="detail-reporte-desc">${desc}</div>` : ''}
  </div>`;

  // Alerta principal
  if (rd.alerta) {
    const ac = rd.estado === 'red' ? 'red' : 'yellow';
    html += `<div class="alert-banner ${ac}">
      <div class="alert-icon">${ac === 'red' ? '🚨' : '⚡'}</div>
      <div class="alert-text">${rd.alerta}</div>
    </div>`;
  }

  // KPIs — clickeables para abrir chat con análisis de ese KPI
  if (rd.kpis?.length) {
    html += `<div class="section-header"><div class="section-header-title">Indicadores clave <span style="font-weight:400;opacity:.6;font-size:9px;text-transform:none;letter-spacing:0">— toca para profundizar</span></div><div class="section-header-line"></div></div>
    <div class="kpi-grid">${rd.kpis.map(k => renderKpiCardDetail(k, empresa, label, desc)).join('')}</div>`;
  }

  // Tramos de cartera
  if (rd.tramos?.length) {
    html += `<div class="section-header"><div class="section-header-title">Distribución de cartera</div><div class="section-header-line"></div></div>
    <div class="tramos">${rd.tramos.map(t => `
      <div class="tramo ${t.estado}">
        <div class="tramo-label">${t.label}</div>
        <div class="tramo-val">${t.valor}</div>
        <div class="tramo-sub">${t.pct || ''}</div>
      </div>`).join('')}</div>`;
  }

  // Mayor riesgo (clientes/proveedores)
  const risks = rd.riesgos || rd.proveedores_criticos || [];
  if (risks.length) {
    const isProveedores = !!rd.proveedores_criticos;
    html += `<div class="section-header"><div class="section-header-title">${isProveedores ? 'Proveedores críticos' : 'Clientes en riesgo'}</div><div class="section-header-line"></div></div>
    <div class="riesgo-list">${risks.slice(0,5).map((r,i) => `
      <div class="riesgo-row">
        <div class="riesgo-rank">#${i+1}</div>
        <div class="riesgo-info">
          <div class="riesgo-name">${r.nombre || r.name || ''}</div>
          <div class="riesgo-sub">${r.canal || r.categoria || ''}</div>
        </div>
        <div>
          <div class="riesgo-val ${sc(r.estado)}">${r.vencido30 || r.monto || r.pct || ''}</div>
          <div class="riesgo-sub-right">${r.total ? 'total ' + r.total : ''}</div>
        </div>
      </div>`).join('')}</div>`;
  }

  // Cumplimiento por gerente
  const gerentes = rd.por_gerente || [];
  if (gerentes.length) {
    html += `<div class="section-header"><div class="section-header-title">Cumplimiento por gerente</div><div class="section-header-line"></div></div>
    <div class="riesgo-list">${gerentes.map(g => {
      const pctN = parseFloat((g.pct || '0').replace('%',''));
      const color = pctN >= 85 ? 'var(--green)' : pctN >= 70 ? 'var(--yellow)' : 'var(--red)';
      return `<div class="gerente-row">
        <div class="gerente-info">
          <div class="gerente-name">${g.nombre || ''}</div>
          <div class="gerente-bar-track">
            <div class="gerente-bar-fill" style="width:${Math.min(100,pctN)}%;background:${color}"></div>
          </div>
        </div>
        <div class="gerente-pct" style="color:${color}">${g.pct || ''}</div>
      </div>`;
    }).join('')}</div>`;
  }

  // Desglose (por UEN, canal, marca, etc.)
  const breakdown = rd.por_uen || rd.por_canal || rd.por_marca || rd.por_categoria || rd.clasificacion || [];
  if (breakdown.length) {
    const bKey = Object.keys(breakdown[0]).find(k => !['estado','monto','pct','avance','real','ratio','interpretacion','margen'].includes(k));
    html += `<div class="section-header"><div class="section-header-title">Desglose</div><div class="section-header-line"></div></div>
    <div class="breakdown-grid">${breakdown.map(b => {
      const val  = b.margen || b.avance || b.ratio || b.pct || '';
      const lbl2 = b[bKey] || '';
      const sub  = b.monto || b.real || b.interpretacion || '';
      return `<div class="breakdown-item">
        <div class="breakdown-label">${lbl2}</div>
        <div class="breakdown-val ${sc(b.estado)}">${val}</div>
        <div class="breakdown-sub">${sub}</div>
      </div>`;
    }).join('')}</div>`;
  }

  // Tendencia
  const tendData = rd.tendencia_mora || rd.tendencia || rd.tendencia_ate || rd.tendencia_dias || rd.tendencia_margen || rd.tendencia_ratio || [];
  if (tendData.length > 1) {
    const vals = tendData.map(t => parseFloat(t.pct || t.val || t.dias || t.ratio || 0));
    const maxV = Math.max(...vals) || 1;
    const minV = Math.min(...vals) * 0.6;
    const lastV = vals[vals.length - 1];
    const prevV = vals[vals.length - 2];
    // Detectar si en este KPI "sube = malo"
    const lbl0 = (rd.kpis?.[0]?.label || tipo).toLowerCase();
    const subeBad = lbl0.includes('mora') || lbl0.includes('dias') || lbl0.includes('merma') || lbl0.includes('dead');
    const going = lastV > prevV ? (subeBad ? 'bad' : 'good') : lastV < prevV ? (subeBad ? 'good' : 'bad') : 'flat';
    const goingText = lastV > prevV ? '↑ Sube' : lastV < prevV ? '↓ Baja' : '→ Estable';
    const suffix = vals[0] !== undefined && typeof vals[0] === 'number' && tendData[0]?.pct !== undefined ? '%' : '';

    html += `<div class="section-header"><div class="section-header-title">Tendencia histórica</div><div class="section-header-line"></div></div>
    <div class="tend-chart">
      <div class="tend-header">
        <div class="tend-chart-label">${tendData.length} periodos</div>
        <div class="tend-trend-text ${going}">${goingText}</div>
      </div>
      <div class="tend-scroll"><div class="tend-bars">${tendData.map((t,i) => {
        const v = vals[i];
        const h = Math.max(6, Math.round(((v - minV) / (maxV - minV || 1)) * 66));
        const isLast = i === tendData.length - 1;
        // Color de barra: si subeBad, alto = rojo
        const barCls = subeBad
          ? (v >= maxV * 0.85 ? 'red' : v >= maxV * 0.65 ? 'yellow' : 'green')
          : (v >= maxV * 0.85 ? 'green' : v >= maxV * 0.65 ? 'yellow' : 'red');
        const displayV = typeof v === 'number' ? (v % 1 !== 0 ? v.toFixed(1) : v) : v;
        return `<div class="tend-col">
          <div class="tend-val${isLast ? ' current' : ''}">${displayV}${suffix}</div>
          <div class="tend-bar ${barCls}${isLast ? ' current' : ''}" style="height:${h}px"></div>
          <div class="tend-mes">${t.mes || ''}</div>
        </div>`;
      }).join('')}</div></div>
      ${rd.kpis?.[0]?.meta ? `<div class="tend-meta-line"><div class="tend-meta-dot"></div><div class="tend-meta-text">Meta: ${esc(rd.kpis[0].meta)}</div></div>` : ''}
    </div>`;
  }

  // Acciones recomendadas
  if (rd.acciones?.length) {
    html += `<div class="decision-box">
      <div class="decision-title">💡 Qué hacer</div>
      ${rd.acciones.map(a => `<div class="decision-item">${a}</div>`).join('')}
    </div>`;
  }

  html += `<button class="png-btn" onclick="openPng('data/latest/${empresa}/${archivo}','${label}')">
    <svg viewBox="0 0 24 24" width="18" height="18" style="stroke:var(--text2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    Ver reporte Power BI original
  </button>
  <button class="ask-btn" onclick="openChatWith('${empresa}','${tipo}','${label}')">
    💬 Preguntarle a Juanito sobre esto
  </button>`;

  document.getElementById('detail-content').innerHTML = html;
  document.getElementById('top-title').textContent  = label;
  document.getElementById('top-badge').textContent  = empresa;
  document.getElementById('back-btn').classList.add('visible');
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-detail').classList.add('active');
  document.getElementById('screens-container').scrollTop = 0;
}

function goBack() {
  if (!navHistory.length) { showTab(currentTab); return; }
  const prev = navHistory.pop();
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(prev.screen).classList.add('active');
  document.getElementById('top-title').textContent = prev.tab === 'home' ? 'Juanito Garcia' : prev.tab.toUpperCase();
  document.getElementById('top-badge').textContent = DATA.fecha || '';
  if (!navHistory.length) document.getElementById('back-btn').classList.remove('visible');
  document.getElementById('screens-container').scrollTop = 0;
}

function initReportes() {
  ['PAUNO','AMAUTA','NEOPACK'].forEach(emp => {
    const grid = document.getElementById('grid-' + emp.toLowerCase());
    if (!grid) return;
    grid.innerHTML = REPORTES_PBI[emp].map(r =>
      `<div class="reporte-card" onclick="openPbi('${r.url}','${emp} — ${r.nombre}')">
        <div class="reporte-card-icon">${r.icon}</div>
        <div class="reporte-card-nombre">${r.nombre}</div>
        <div class="reporte-card-empresa">${emp}</div>
      </div>`
    ).join('');
  });
}

function openPbi(url, titulo) {
  document.getElementById('pbi-iframe').src = url;
  document.getElementById('pbi-viewer-title').textContent = titulo;
  document.getElementById('reportes-list').style.display = 'none';
  document.getElementById('pbi-viewer').style.display = 'flex';
}

function closePbi() {
  document.getElementById('pbi-iframe').src = '';
  document.getElementById('pbi-viewer').style.display = 'none';
  document.getElementById('reportes-list').style.display = 'block';
}

function showTab(tab) {
  navHistory = [];
  currentTab = tab;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + tab).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.tab === tab));
  const titles = { home: 'Juanito Garcia', reportes: 'Reportes Power BI' };
  document.getElementById('top-title').textContent = titles[tab] || tab.toUpperCase();
  document.getElementById('top-badge').textContent = DATA?.fecha || '';
  document.getElementById('back-btn').classList.remove('visible');
  document.getElementById('screens-container').scrollTop = 0;
  if (tab === 'reportes') { closePbi(); initReportes(); }
}

function openPng(src, title) {
  document.getElementById('png-viewer-title').textContent = title;
  document.getElementById('png-img').src = src;

}

function openChat() {
  document.getElementById('chat-modal').classList.add('open');
  if (document.getElementById('chat-messages').children.length === 0) {
    const sugerencias = [
      '¿Qué debo decidir hoy?',
      '¿Cómo está la situación general?',
      '¿Cómo están las ventas de PAUNO?',
      '¿Cómo está la mora?',
      '¿Cuál empresa está más crítica?',
    ];
    const chips = sugerencias.map(s =>
      `<button class="chat-chip" onclick="usarChip('${s}')">${s}</button>`
    ).join('');
    const msg = document.createElement('div');
    msg.className = 'msg assistant';
    msg.innerHTML = `Hola. Soy Juanito Garcia. Datos del <b>${DATA?.fecha || 'hoy'}</b>.<br><br>Puedes preguntarme sobre los KPIs del holding:<div class="chat-chips">${chips}</div>`;
    document.getElementById('chat-messages').appendChild(msg);
  }
}

function usarChip(texto) {
  const input = document.getElementById('chat-input');
  input.value = texto;
  autoResize(input);
  sendChat();
}
function closeChat() { document.getElementById('chat-modal').classList.remove('open'); }

function openChatWith(empresa, tipo, label) {
  openChat();
  setTimeout(() => {
    const input = document.getElementById('chat-input');
    input.value = `Dame más detalle sobre ${label} de ${empresa}.`;
    autoResize(input);
    input.focus();
    setTimeout(() => sendChat(), 150);
  }, 300);
}

function openChatWithMsg(pregunta) {
  openChat();
  setTimeout(() => {
    const input = document.getElementById('chat-input');
    input.value = pregunta;
    autoResize(input);
    input.focus();
    setTimeout(() => sendChat(), 150);
  }, 300);
}

function addMsg(role, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  // Renderizar saltos de línea
  el.innerHTML = text.replace(/\n/g, '<br>');
  const msgs = document.getElementById('chat-messages');
  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
  return el;
}

function handleChatKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); } }
function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 100) + 'px'; }

function buscarRespuestaLocal(pregunta) {
  const qa = DATA?.chat_qa;
  if (!qa || !qa.length) return null;
  const p = pregunta.toLowerCase();
  // Buscar la pregunta pre-generada más similar por palabras clave
  const scores = qa.map(item => {
    const q = item.pregunta.toLowerCase();
    const palabras = p.split(/\s+/).filter(w => w.length > 3);
    const matches = palabras.filter(w => q.includes(w)).length;
    return { item, score: matches / Math.max(palabras.length, 1) };
  });
  scores.sort((a, b) => b.score - a.score);
  if (scores[0].score >= 0.3) return scores[0].item.respuesta;
  return null;
}

function sendChat() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || !DATA) return;
  input.value = '';
  input.style.height = 'auto';
  addMsg('user', text);

  const send = document.getElementById('chat-send');
  send.disabled = true;
  const loadEl = addMsg('assistant', '...');
  loadEl.classList.add('loading');

  // Intentar respuesta local primero (sin API, funciona en todos los dispositivos)
  setTimeout(() => {
    const local = buscarRespuestaLocal(text);
    if (local) {
      loadEl.innerHTML = local.replace(/\n/g, '<br>');
      loadEl.classList.remove('loading');
      send.disabled = false;
      return;
    }
    // Si no hay match local, mostrar mensaje útil
    loadEl.innerHTML = 'No tengo una respuesta pre-cargada para esa consulta. Prueba preguntando sobre: ventas, mora, margen, compras, mermas, inventario, fill rate, control interno, o pide el resumen general del holding.';
    loadEl.classList.remove('loading');
    send.disabled = false;
  }, 400);
}

// Contexto compacto — solo datos clave, sin tendencias históricas largas
function construirContexto() {
  const d = DATA;
  const obj = {
    fecha: d.fecha,
    semaforos: d.semaforos,
    semaforo_razon: d.semaforo_razon,
    holding_ventas: d.holding_ventas,
    holding_mora: d.holding_mora,
    agenda_ceo: d.agenda_ceo,
    empresas: {}
  };
  // Por cada empresa: solo alertas + KPIs (sin tendencia histórica)
  Object.entries(d.empresas || {}).forEach(([emp, ed]) => {
    obj.empresas[emp] = { reportes: {} };
    Object.entries(ed.reportes || {}).forEach(([tipo, rd]) => {
      obj.empresas[emp].reportes[tipo] = {
        estado: rd.estado,
        alerta: rd.alerta,
        kpis: rd.kpis,
        acciones: (rd.acciones || []).slice(0, 3),
        riesgos: (rd.riesgos || []).slice(0, 3),
        proveedores_criticos: (rd.proveedores_criticos || []).slice(0, 3),
        tramos: rd.tramos,
        por_gerente: rd.por_gerente,
        por_uen: rd.por_uen,
        por_canal: rd.por_canal,
        por_categoria: rd.por_categoria
        // excluimos tendencia_* para reducir tamaño
      };
    });
  });
  return JSON.stringify(obj);
}
