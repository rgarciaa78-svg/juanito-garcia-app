name: JUANITO — Fetch Power BI Data

on:
  schedule:
    # 7:30am Lima (UTC-5) = 12:30 UTC, todos los días. El Perú no cambia de
    # hora, así que la conversión es fija todo el año.
    - cron: '30 12 * * *'
    # Segundo intento a las 10:00 Lima. GitHub no garantiza los horarios: en
    # momentos de carga retrasa o directamente descarta las corridas
    # programadas, y entre el 31 de agosto y el 8 de setiembre no disparo
    # ninguna. Correr dos veces no cuesta nada y no depender de un solo
    # disparo es la diferencia entre tener el dato del dia o el de ayer.
    # El sabado y el domingo Power BI devuelve las mismas cifras del viernes;
    # correr igual evita que el lunes el tablero arranque con dato de tres
    # dias y con el aviso rojo de antiguedad encendido.
    - cron: '0 15 * * *'
  workflow_dispatch:  # permite correr manualmente

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Power BI data
        env:
          AZURE_TENANT_ID:     ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:     ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          PBI_USERNAME:        ${{ secrets.PBI_USERNAME }}
          PBI_PASSWORD:        ${{ secrets.PBI_PASSWORD }}
          PBI_WORKSPACE_ID:    ${{ secrets.PBI_WORKSPACE_ID }}
        run: python scripts/fetch_powerbi.py

      - name: Fetch serie histórica mensual (desde Ene-2025)
        env:
          AZURE_TENANT_ID:     ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:     ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          PBI_USERNAME:        ${{ secrets.PBI_USERNAME }}
          PBI_PASSWORD:        ${{ secrets.PBI_PASSWORD }}
        run: python scripts/fetch_series.py
        continue-on-error: true

      # Un heredoc de Python dentro de un `run:` indentado hereda la
      # indentación del YAML y revienta antes de ejecutar nada; por eso la
      # comprobación vive en su propio archivo, donde además se puede probar.
      - name: Verificar que el dato publicado es de hoy
        run: python scripts/verificar_publicado.py

      - name: Commit & push JSON files
        run: |
          git config user.name  "JUANITO Bot"
          git config user.email "juanito@pauno.pe"
          git add data/latest/summaries.json data/latest/measure_cache.json data/latest/series.json data/historico/historico.json || true
          git diff --staged --quiet && echo "sin cambios que publicar" && exit 0
          git commit -m "data: auto-update Power BI $(date -u +'%Y-%m-%d %H:%M UTC') [${{ github.event_name }}]"

          # La corrida tarda ~10 minutos. Si alguien sube algo al repositorio
          # mientras tanto, el push se rechaza y se pierde toda la extracción
          # aunque haya funcionado (pasó en la corrida 63). Se reintenta
          # trayendo lo nuevo con rebase: los datos van en archivos propios,
          # así que no hay conflicto real con cambios de código.
          REMOTO="https://x-access-token:${{ secrets.GH_PAT }}@github.com/rgarciaa78-svg/juanito-garcia-app.git"
          for intento in 1 2 3; do
            if git push "$REMOTO" HEAD:main; then
              echo "publicado en el intento $intento"
              exit 0
            fi
            echo "push rechazado — traigo los cambios remotos y reintento"
            git pull --rebase "$REMOTO" main || exit 1
          done
          echo "no se pudo publicar tras 3 intentos"
          exit 1
