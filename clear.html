<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Actualizando JUANITO...</title>
<style>
body { font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #1e3a5f; color: #fff; gap: 16px; }
.spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
h2 { font-size: 18px; font-weight: 700; margin: 0; }
p { font-size: 13px; opacity: 0.7; margin: 0; text-align: center; }
</style>
</head>
<body>
<div class="spinner"></div>
<h2>Actualizando JUANITO</h2>
<p id="msg">Limpiando caché viejo...</p>
<script>
(async function() {
  const msg = document.getElementById('msg');

  // 1. Borrar todos los caches
  try {
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    msg.textContent = 'Desregistrando Service Workers...';
  } catch(e) {}

  // 2. Desregistrar todos los Service Workers
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    msg.textContent = 'Descargando app actualizada...';
  } catch(e) {}

  // 3. Limpiar storage
  try { localStorage.clear(); sessionStorage.clear(); } catch(e) {}

  // 4. Fetch del index.html fresco DESDE ESTA MISMA PÁGINA
  //    (no redirect — evita que el SW viejo intercepte)
  try {
    const base = 'https://rgarciaa78-svg.github.io/juanito-garcia-app/index.html?bust=' + Date.now();
    const response = await fetch(base, {
      cache: 'no-store',
      headers: { 'Cache-Control': 'no-cache, no-store' }
    });

    if (!response.ok) throw new Error('HTTP ' + response.status);

    const html = await response.text();
    msg.textContent = '✓ Listo. Abriendo...';

    // Reemplazar el documento completo con el HTML fresco
    document.open();
    document.write(html);
    document.close();

    // Actualizar la URL en la barra sin hacer navegación
    history.replaceState(null, '', './index.html');

  } catch(e) {
    msg.textContent = 'Error: ' + e.message + '. Redirigiendo...';
    setTimeout(() => {
      window.location.href = 'https://rgarciaa78-svg.github.io/juanito-garcia-app/index.html?bust=' + Date.now();
    }, 1500);
  }
})();
</script>
</body>
</html>
