<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Limpiando caché...</title>
<style>
body { font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #fff; color: #1c1c1e; gap: 16px; }
.spinner { width: 36px; height: 36px; border: 3px solid #e5e7eb; border-top-color: #1565c0; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
p { font-size: 14px; color: #6b7280; }
</style>
</head>
<body>
<div class="spinner"></div>
<p id="msg">Limpiando caché...</p>
<script>
(async function() {
  try {
    // 1. Borrar todos los caches
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    // 2. Desregistrar todos los Service Workers
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    // 3. Limpiar localStorage y sessionStorage
    try { localStorage.clear(); } catch(e) {}
    try { sessionStorage.clear(); } catch(e) {}

    document.getElementById('msg').textContent = '✓ Listo. Abriendo app...';
    // 4. Redirigir al app con cache-bust
    setTimeout(() => {
      window.location.replace('./index.html?fresh=' + Date.now());
    }, 800);
  } catch(e) {
    document.getElementById('msg').textContent = 'Error: ' + e.message;
    setTimeout(() => { window.location.replace('./'); }, 1500);
  }
})();
</script>
</body>
</html>
